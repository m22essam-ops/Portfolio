<main id="page">
  <div class="wrap cab-wrap">

    <!-- THE CABINET
         Isometric, drawn as vectors rather than a picture: it has to open,
         and nothing here should be a download. The two doors swing on their
         own transforms; the shelves behind them stay empty, which is the
         entire point of the page. -->
    <div class="cab-stage">
      <svg class="cab" id="cab" viewBox="0 0 520 560" role="img"
           aria-labelledby="cabTitle" xmlns="http://www.w3.org/2000/svg">
        <title id="cabTitle">An empty awards cabinet</title>

        <!-- the case, seen from a corner -->
        <g class="cab-body">
          <!-- side -->
          <path class="ink-3" d="M60 118 L60 470 L150 512 L150 160 Z"/>
          <!-- back panel, the inside -->
          <path class="ink-2" d="M150 160 L150 512 L470 448 L470 96 Z"/>
          <!-- top -->
          <path class="ink-1" d="M60 118 L150 160 L470 96 L380 54 Z"/>

          <!-- shelves. Each one is a slab plus its front edge, and each is
               a row the trophies stand on. -->
          <g id="shelves">
            <g class="shelf" data-row="0">
              <path class="shelf-top"  d="M150 268 L470 204 L470 214 L150 278 Z"/>
            </g>
            <g class="shelf" data-row="1">
              <path class="shelf-top"  d="M150 356 L470 292 L470 302 L150 366 Z"/>
            </g>
            <g class="shelf" data-row="2">
              <path class="shelf-top"  d="M150 444 L470 380 L470 390 L150 454 Z"/>
            </g>
          </g>

        </g>

        <!-- the doors. Glass, so the empty shelves are visible through them
             before they open, which is the whole gag. -->
        <g id="doors">
          <g class="door door-l" id="doorL">
            <path class="glass" d="M150 160 L310 128 L310 480 L150 512 Z"/>
            <path class="frame" d="M150 160 L310 128 L310 480 L150 512 Z"/>
            <path class="glint" d="M172 190 L214 182 L190 470 L166 476 Z"/>
            <circle class="knob" cx="298" cy="308" r="6"/>
          </g>
          <g class="door door-r" id="doorR">
            <path class="glass" d="M310 128 L470 96 L470 448 L310 480 Z"/>
            <path class="frame" d="M310 128 L470 96 L470 448 L310 480 Z"/>
            <path class="glint" d="M330 160 L372 152 L348 448 L324 454 Z"/>
            <circle class="knob" cx="322" cy="304" r="6"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- the words, after it opens. One line. The minutes/days/years game that
         used to sit here is gone: it was three buttons and four more lines of
         copy asking the visitor to play with an empty cupboard, and the joke
         was already over the moment the doors opened on nothing. -->
    <!-- NOT hidden, and the line is written in at load. The column centres
         itself on its content, so a block that appears at the end changes the
         height and shoves the cabinet upwards just as the doors finish. It
         holds its space from the first frame and only fades in. -->
    <div class="cab-say" id="say">
      <p class="cab-line" id="line"></p>
      <p class="cab-back"><a href="index.html">Back to the ticket →</a></p>
    </div>

  </div>
</main>

<script>
(function () {
  var C = window.SITE_CONTENT || {};
  var A = (C.ticket && C.ticket.cabinet) || {};

  var cab   = document.getElementById('cab');
  var say   = document.getElementById('say');
  var line  = document.getElementById('line');

  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- the line ----
     One sentence, and a piece of it is the booking link. Same shape as the
     footer: he writes the sentence, names the words inside it that should be
     the link, and the link follows whatever he writes. Sliced by position
     rather than by replacing the phrase, so his capitalisation survives. */
  function writeLine() {
    var text = String(A.line || 'Nothing to show yet. Please come back in a year to check.').trim();
    var bit  = String(A.linkText || '').trim();
    var url  = String(A.linkUrl || '').trim();
    var at   = bit ? text.toLowerCase().indexOf(bit.toLowerCase()) : -1;

    line.textContent = '';
    if (at > -1 && url) {
      line.appendChild(document.createTextNode(text.slice(0, at)));
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = text.substr(at, bit.length);
      line.appendChild(a);
      line.appendChild(document.createTextNode(text.slice(at + bit.length)));
    } else {
      line.textContent = text;
    }
  }

  /* ---- the sequence ----
     Staged, rather than one transition on everything at once. The case
     settles, the shelves draw themselves in one after another so the
     emptiness is something you watch being built, the doors take up their
     slack and then swing, and the line arrives last. */
  function open() {
    /* the words are put in straight away so the column's height is settled
       before anything moves; only their opacity waits */
    writeLine();

    if (still) {
      cab.classList.add('is-in', 'is-drawn', 'is-open');
      say.classList.add('in');
      return;
    }
    cab.classList.add('is-in');                       /* the case settles */
    setTimeout(function () { cab.classList.add('is-drawn');  }, 420);  /* shelves */
    setTimeout(function () { cab.classList.add('is-unlatch');}, 1060); /* slack */
    setTimeout(function () {
      cab.classList.remove('is-unlatch');
      cab.classList.add('is-open');                   /* and swing */
    }, 1240);
    setTimeout(function () { say.classList.add('in'); }, 2050);
  }

  open();

  if (C.jokes && C.jokes.tabAway) {
    var realTitle = document.title;
    document.addEventListener('visibilitychange', function () {
      document.title = document.hidden ? C.jokes.tabAway : realTitle;
    });
  }
})();
</script>
