<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Mohamed Essam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400;1,9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav id="siteNav">
  <div class="wrap">
    <div class="brand">
      <a class="logo" href="index.html" aria-label="Mohamed Essam — home"></a>
      <span class="tagline"></span>
    </div>
    <div class="nav-links">
      <a href="index.html#work">WORK</a>
      <a href="about.html">ABOUT</a>
    </div>
    <div class="badge"><span class="badge-dot"></span><span class="badge-text"></span></div>
  </div>
</nav>

<section id="about" style="border-top: none; padding-top: 40px;">
  <div class="wrap">
    <span class="section-label reveal" id="aboutLabel"></span>
    <h2 class="reveal" id="aboutHeading"></h2>
    <div class="about-grid reveal">
      <div class="about-portrait-wrap" id="aboutPortraitWrap">
        <img class="about-portrait" id="aboutPortrait" src="" alt="">
      </div>
      <div id="aboutText"></div>
    </div>
    <div class="exp-list reveal" id="expList"></div>

    <div class="contact-block reveal" id="aboutContact">
      <span class="section-label" id="contactLabel"></span>
      <h2 class="contact-heading" id="contactHeading"></h2>
      <p class="contact-sub" id="contactSub"></p>
      <div class="contact-links" id="contactLinks"></div>
      <a class="resume-btn" id="resumeBtn" href="" target="_blank" rel="noopener" hidden></a>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p class="footer-line"></p>
  </div>
  <div class="mega-mark" aria-hidden="true"></div>
</footer>

<script src="content.js"></script>
<script src="site.js"></script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT.about;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  document.getElementById('aboutLabel').textContent = C.label;
  document.getElementById('aboutHeading').textContent = C.heading;

  var portrait = document.getElementById('aboutPortrait');
  portrait.src = window.imgSrc(C.portrait);
  portrait.alt = C.portraitAlt || 'Mohamed Essam';

  var box = document.getElementById('aboutText');
  var html = (C.paragraphs || []).map(function (t) {
    return '<p class="about-text">' + esc(t) + '</p>';
  }).join('');
  html += '<div class="skills-list">' + (C.skills || []).map(function (s) {
    return '<span class="skill-tag">' + esc(s) + '</span>';
  }).join('') + '</div>';
  box.innerHTML = html;

  document.getElementById('expList').innerHTML = (C.experience || []).map(function (e) {
    return '<div class="exp-row">' +
      '<div><span class="exp-role">' + esc(e.role) + '</span><span class="exp-org">' + esc(e.org) + '</span></div>' +
      '<span class="exp-time">' + esc(e.time) + '</span>' +
      '</div>';
  }).join('');

  /* ---------- contact block: who to reach, with channel icons ---------- */
  var CT = window.SITE_CONTENT.contact || {};

  function ic(svg, filled) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"' + (filled ? ' style="fill:currentColor;stroke:none"' : '') + '>' + svg + '</svg>';
  }
  var ICONS = {
    mail: ic('<path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>', true),
    whatsapp: ic('<path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>', true),
    linkedin: ic('<path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>', true),
    instagram: ic('<path d="M12 0C8.74 0 8.333.015 7.053.072 5.775.132 4.905.333 4.14.63c-.789.306-1.459.717-2.126 1.384S.935 3.35.63 4.14C.333 4.905.131 5.775.072 7.053.012 8.333 0 8.74 0 12s.015 3.667.072 4.947c.06 1.277.261 2.148.558 2.913.306.788.717 1.459 1.384 2.126.667.666 1.336 1.079 2.126 1.384.766.296 1.636.499 2.913.558C8.333 23.988 8.74 24 12 24s3.667-.015 4.947-.072c1.277-.06 2.148-.262 2.913-.558.788-.306 1.459-.718 2.126-1.384.666-.667 1.079-1.335 1.384-2.126.296-.765.499-1.636.558-2.913.06-1.28.072-1.687.072-4.947s-.015-3.667-.072-4.947c-.06-1.277-.262-2.149-.558-2.913-.306-.789-.718-1.459-1.384-2.126C21.319 1.347 20.651.935 19.86.63c-.765-.297-1.636-.499-2.913-.558C15.667.012 15.26 0 12 0zm0 2.16c3.203 0 3.585.016 4.85.071 1.17.055 1.805.249 2.227.415.562.217.96.477 1.382.896.419.42.679.819.896 1.381.164.422.36 1.057.413 2.227.057 1.266.07 1.646.07 4.85s-.015 3.585-.074 4.85c-.061 1.17-.256 1.805-.421 2.227-.224.562-.479.96-.899 1.382-.419.419-.824.679-1.38.896-.42.164-1.065.36-2.235.413-1.274.057-1.649.07-4.859.07-3.211 0-3.586-.015-4.859-.074-1.171-.061-1.816-.256-2.236-.421-.569-.224-.96-.479-1.379-.899-.421-.419-.69-.824-.9-1.38-.165-.42-.359-1.065-.42-2.235-.045-1.26-.061-1.649-.061-4.844 0-3.196.016-3.586.061-4.861.061-1.17.255-1.814.42-2.234.21-.57.479-.96.9-1.381.419-.419.81-.689 1.379-.898.42-.166 1.051-.361 2.221-.421 1.275-.045 1.65-.06 4.859-.06l.045.03zm0 3.678a6.162 6.162 0 100 12.324 6.162 6.162 0 100-12.324zM12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm7.846-10.405a1.441 1.441 0 01-2.88 0 1.44 1.44 0 012.88 0z"/>', true),
    vimeo: ic('<path d="M23.977 6.416c-.105 2.338-1.739 5.543-4.894 9.609-3.268 4.247-6.026 6.37-8.29 6.37-1.409 0-2.578-1.294-3.553-3.881L5.322 11.4C4.603 8.816 3.834 7.522 3.01 7.522c-.179 0-.806.378-1.881 1.132L0 7.197c1.185-1.044 2.351-2.084 3.501-3.128C5.08 2.701 6.266 1.984 7.055 1.91c1.867-.18 3.016 1.1 3.447 3.838.465 2.953.789 4.789.971 5.507.539 2.45 1.131 3.674 1.776 3.674.502 0 1.256-.796 2.265-2.385 1.004-1.589 1.54-2.797 1.612-3.628.144-1.371-.395-2.061-1.614-2.061-.574 0-1.167.121-1.777.391 1.186-3.868 3.434-5.757 6.762-5.637 2.473.06 3.628 1.664 3.493 4.797l-.013.01z"/>', true),
    link: ic('<path d="M9 15l6-6M10.5 7.5l1.5-1.5a3.5 3.5 0 0 1 5 5l-1.5 1.5M13.5 16.5l-1.5 1.5a3.5 3.5 0 0 1-5-5l1.5-1.5"/>')
  };

  function iconFor(l) {
    var hay = String((l.label || '') + ' ' + (l.url || '')).toLowerCase();
    if (/^mailto:/i.test(l.url || '') || hay.indexOf('@') > -1 || hay.indexOf('mail') > -1 || hay.indexOf('gmail') > -1) return ICONS.mail;
    if (hay.indexOf('whatsapp') > -1) return ICONS.whatsapp;
    if (hay.indexOf('linkedin') > -1) return ICONS.linkedin;
    if (hay.indexOf('instagram') > -1) return ICONS.instagram;
    if (hay.indexOf('vimeo') > -1) return ICONS.vimeo;
    return ICONS.link;
  }

  function isEmailLink(l) {
    var h = String((l.label || '') + ' ' + (l.url || '')).toLowerCase();
    return /^mailto:/i.test(l.url || '') || h.indexOf('@') > -1;
  }

  document.getElementById('contactLabel').textContent = CT.label || '';
  document.getElementById('contactHeading').innerHTML =
    esc(CT.headline || '') + (CT.ctaText ? ' <span class="si">' + esc(CT.ctaText) + '</span>' : '');
  document.getElementById('contactSub').textContent = CT.sub || '';
  document.getElementById('contactLinks').innerHTML = (CT.links || []).map(function (l) {
    /* social links open in a new tab; the mailto link stays in place */
    var ext = isEmailLink(l) ? '' : ' target="_blank" rel="noopener"';
    return '<a href="' + esc(l.url) + '"' + (isEmailLink(l) ? ' class="email"' : '') + ext +
      ' aria-label="' + esc(l.label || '') + '" title="' + esc(l.label || '') + '">' +
      iconFor(l) + '</a>';
  }).join('');

  /* ---------- resume button (hidden until a link is set in admin) ---------- */
  var rb = document.getElementById('resumeBtn');
  if (rb && CT.resume && CT.resume.url) {
    rb.href = CT.resume.url;
    rb.textContent = CT.resume.label || 'Résumé';
    rb.hidden = false;
  }

  /* the portrait is a square as big as the text beside it: its side is set
     to the text column's height, so the two always balance. Two passes
     converge (the first pass narrows the text column, which changes its
     height), and it re-runs when fonts settle or the window resizes. */
  var pwrap = document.getElementById('aboutPortraitWrap');
  function sizePortrait() {
    if (!pwrap) return;
    if (window.matchMedia('(max-width: 700px)').matches) return; /* mobile: fixed square, centered by CSS */
    /* the square mirrors the text height; 480 caps it so a very long bio
       can't crush the text column into a sliver */
    var side = Math.max(260, Math.min(480, Math.round(box.offsetHeight)));
    pwrap.style.width = side + 'px';
    pwrap.style.height = side + 'px';
  }
  sizePortrait();
  sizePortrait();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { sizePortrait(); sizePortrait(); });
  }
  window.addEventListener('resize', sizePortrait);
})();
</script>

</body>
</html>
