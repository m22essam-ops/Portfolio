<!-- the tear-off stub. site.js fills it. -->
<footer class="stub" id="siteFoot"></footer>

<!-- content.js is fetched with a stamp that changes every minute.
     GitHub Pages serves it with cache-control: max-age=600, so for ten
     minutes after a save the live site kept handing out the previous
     words and the save looked as though it had done nothing. A plain
     request was measured returning a fifty-minute-old copy while the
     same file, asked for with a query, came back current.
     Only on a real web server: a query string on a file URL is not
     reliably understood and the owner previews by double-clicking. -->
<script>
(function () {
  /* only on a real web server. Anything else (file://, and the data: URLs
     some preview panes use) gets exactly the tag this always had, so the
     double-click workflow cannot regress. */
  var v = /^https?:$/.test(location.protocol) ? '?v=' + Math.floor(Date.now() / 60000) : '';
  document.write('<scr' + 'ipt src="content.js' + v + '"><\/scr' + 'ipt>');
})();
</script>
<script src="site.js"></script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT || {};
  var A = C.about || {};

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  document.getElementById('aboutHeading').textContent = A.heading || 'Who I am.';

  var portrait = document.getElementById('aboutPortrait');
  if (A.portrait) {
    portrait.src = window.imgSrc(A.portrait);
    portrait.alt = A.portraitAlt || 'Mohammed Essam';
  } else {
    portrait.style.display = 'none';
  }

  var box = document.getElementById('aboutText');
  var html = (A.paragraphs || []).map(function (t) {
    return '<p class="about-text">' + esc(t) + '</p>';
  }).join('');
  if ((A.skills || []).length) {
    html += '<div class="skills-list">' + A.skills.map(function (s) {
      return '<span class="skill-tag">' + esc(s) + '</span>';
    }).join('') + '</div>';
  }
  box.innerHTML = html;

  document.getElementById('expList').innerHTML = (A.experience || []).map(function (e) {
    return '<div class="exp-row">' +
      '<div><span class="exp-role">' + esc(e.role) + '</span><span class="exp-org">' + esc(e.org) + '</span></div>' +
      '<span class="exp-time">' + esc(e.time) + '</span>' +
      '</div>';
  }).join('');

  /* the footer stub, including its small print, is built by site.js */

  /* the quiet jokes */
  var J = C.jokes || {};
  if (J.tabAway) {
    var realTitle = document.title;
    document.addEventListener('visibilitychange', function () {
      document.title = document.hidden ? J.tabAway : realTitle;
    });
  }
  if (J.console && window.console) console.log('%c' + J.console, 'color:#E3261A;font-size:13px');
})();
</script>
