<!-- THE PAGE AND ITS AD (15 Sep 2026). Two columns for the whole height of
     the page: everything he wrote on the left, and a skyscraper ad on the
     right that stays pinned while you scroll. The ad was his idea for the
     dead right-hand half of this page, and the joke is that it works: click
     it, pick a picture, and your ad is running, to an audience of one,
     because the picture never leaves your own browser.

     The rail is the whole page tall on purpose. Pinned inside one grid row,
     an earlier version let go after 450px of scrolling. Below 1100px the ad
     is gone, as real skyscrapers are, and the page is exactly what it was. -->
<div class="wrap">
  <div class="ab-page" id="abPage">
    <div class="ab-main" id="abMain">

      <header class="page-head ab-head">
        <h1 id="aboutHeading"></h1>
        <!-- WHAT HE IS, IN PLAIN WORDS (19 Sep 2026).
             The page opens on a joke and then a story about a bicycle, so
             nothing on it ever said the job title, the languages or the city.
             A person skimming had to read four paragraphs to find out, and a
             search engine reads visible words far more seriously than it
             reads a tag. One line, in the system voice, and it is a field in
             admin like everything else: empty it and it disappears. -->
        <p class="ab-line" id="aboutLine" hidden></p>
      </header>

      <div class="about-grid" id="abGrid">
        <!-- the picture needs a red ground behind it for the screen blend to
             print against, so it sits in its own frame -->
        <div class="about-shot" id="aboutShot">
          <img class="about-portrait" id="aboutPortrait" src="" alt="">
        </div>
        <div>
          <div id="aboutText"></div>
          <!-- The two lists break out of this column and run the full page
               width. They are inside it so they follow the bio, and pulled left
               by exactly the left column plus the gap. The résumé is the last
               row of Experience: the full version of the list it sits under. -->
          <div class="lists">
            <p class="blk-head" id="expHead" hidden>Experience</p>
            <div class="exp-list" id="expList"></div>
            <p class="blk-head" id="langHead" hidden>Languages</p>
            <div class="lang-list" id="langList"></div>
          </div>
        </div>
      </div>

      <!-- SAY HI, as rows in the job list's own language (15 Sep 2026). It was a
           2px red rule, a big address and a strip of bare icons, which he hated
           twice: red over a contact block is the call-to-action band again, and
           floating icons are every "follow me" strip there is. Built from
           contact.links, so admin is still the one place to edit. -->
      <section class="c-rows" id="aboutContact" hidden>
        <p class="blk-head">Say hi</p>
        <div class="exp-list" id="contactRows"></div>
      </section>

    </div>

    <aside class="ab-rail" aria-label="Advertisement">

            <span class="sky-cta"><span id="skyCta"></span><i aria-hidden="true">&rarr;</i></span>
          </span>
          <span class="sky-ran"><img alt="Your advertisement" id="skyImg"></span>
        </button>
        <p class="sky-live" id="skyLive" hidden></p>

<!-- content.js is fetched with a stamp that changes every minute.
     GitHub Pages serves it with cache-control: max-age=600, so for ten
     minutes after a save the live site kept handing out the previous
     words and the save looked as though it had done nothing. A plain
     request was measured returning a fifty-minute-old copy while the
     same file, asked for with a query, came back current.
     Only on a real web server: a query string on a file URL is not
     reliably understood and the owner previews by double-clicking. -->
<script>
(function () {
  /* only on a real web server. Anything else (file://, and the data: URLs
     some preview panes use) gets exactly the tag this always had, so the
     double-click workflow cannot regress. */
  var v = /^https?:$/.test(location.protocol) ? '?v=' + Math.floor(Date.now() / 60000) : '';
  document.write('<scr' + 'ipt src="content.js' + v + '"><\/scr' + 'ipt>');
})();
</script>
<script src="site.js"></script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT || {};
  var A = C.about || {};

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var heading = A.heading || 'Who I am.';
  document.getElementById('aboutHeading').textContent = heading;

  var lineEl = document.getElementById('aboutLine');
  var line = String(A.line == null ? '' : A.line).trim();
  if (line) { lineEl.textContent = line; lineEl.hidden = false; }

  var portrait = document.getElementById('aboutPortrait');
  /* ---- the portrait, and the rest of the roll ----
     `about.portraits` is a list; `about.portrait` is the old single field and
     still works, so nothing breaks if he never adds a second one. With more
     than one the frame becomes a shuffle: hovering steps to the next, and a
     click does the same, which is the only version that works on a phone
     where there is no hover at all. The swap is a hard cut, not a fade:
     the art direction is flat and a cross-fade would put a soft grey moment
     in the middle of two duotones. */
  var roll = (A.portraits && A.portraits.length ? A.portraits : [A.portrait])
    .filter(function (s) { return s && String(s).trim(); });

  if (roll.length) {
    var shot = document.getElementById('aboutShot');
    var seen = 0;
    portrait.src = window.imgSrc(roll[0]);
    portrait.alt = A.portraitAlt || 'Mohammed Essam';

    if (roll.length > 1) {
      /* decode them all up front, or the first swap is a blank frame */
      roll.slice(1).forEach(function (s) { new Image().src = window.imgSrc(s); });

      var step = function () {
        seen = (seen + 1) % roll.length;
        portrait.src = window.imgSrc(roll[seen]);
      };
      shot.classList.add('has-roll');
      shot.setAttribute('title', roll.length + ' photos. Hover or tap.');

      /* While the pointer is on it, it keeps going: one photograph a second
         until they leave. Desktop only, because a touch screen has no pointer
         to rest anywhere, and the tap below already steps it.

         Not under reduced motion either: content that changes itself on a
         timer is the thing that setting is asking us not to do. Those
         visitors still get the tap and the keyboard. */
      var hoverRoll = null;
      var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (canHover && !still) {
        shot.addEventListener('mouseenter', function () {
          step();                                   /* one straight away */
          clearInterval(hoverRoll);
          hoverRoll = setInterval(step, 1000);      /* then one a second */
        });
        shot.addEventListener('mouseleave', function () {
          clearInterval(hoverRoll);
          hoverRoll = null;
        });
        /* a tab switch leaves the pointer nowhere, so stop rather than run on
           in a page nobody is looking at */
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) { clearInterval(hoverRoll); hoverRoll = null; }
        });
      } else if (canHover) {
        shot.addEventListener('mouseenter', step);  /* reduced motion: one step */
      }

      shot.addEventListener('click', step);
      /* it is a control now, so it has to answer a keyboard too */
      shot.setAttribute('tabindex', '0');
      shot.setAttribute('role', 'button');
      shot.setAttribute('aria-label', 'Show the next photo');
      shot.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(); }
      });
    }
  } else {
    var empty = document.getElementById('aboutShot');
    if (empty) empty.style.display = 'none';
  }

  var box = document.getElementById('aboutText');
  var html = (A.paragraphs || []).map(function (t) {
    return '<p class="about-text">' + esc(t) + '</p>';
  }).join('');
  var skills = A.skills || [];
  /* A skill can be a door. about.skillLinks pairs the exact words with a
     page, so "Manipulating" opens the piece about manipulating, and clicking
     a confession is the joke completing itself.

     Matching is on the words, not the position, so reordering the skills
     list cannot move the door onto the wrong one.

     No skillLinks, or a name that matches nothing, and every tag is exactly
     the span it always was. */
  if (skills.length) {
    var links = {};
    (A.skillLinks || []).forEach(function (l) {
      if (l && l.skill && l.url) links[String(l.skill).trim().toLowerCase()] = l.url;
    });
    html += '<div class="skills-list">' + skills.map(function (s) {
      var to = links[String(s).trim().toLowerCase()];
      return to
        ? '<a class="skill-tag is-link" href="' + esc(to) + '">' + esc(s) + '</a>'
        : '<span class="skill-tag">' + esc(s) + '</span>';
    }).join('') + '</div>';
  }
  box.innerHTML = html;

  var jobs = A.experience || [];
  /* The agency is set bold, the place beside it is not. One field holds both
     ("Yango, MENA", "Ducklife, Dubai (part-time)"), so the break is at the
     first comma or bracket: what comes before is the company, what comes
     after is where it was. The full-width forms are matched too, because a
     character pasted out of a document can be either one.

     An entry with neither, "Freelance", is bold all through, which is right. */
  function orgHtml(org) {
    var s = String(org == null ? '' : org);
    var m = /[,，、(（]/.exec(s);
    return (m && m.index > 0)
      ? '<b>' + esc(s.slice(0, m.index)) + '</b>' +
        '<span class="exp-place">' + esc(s.slice(m.index)) + '</span>'
      : '<b>' + esc(s) + '</b>';
  }

  /* ONE LINE A JOB: agency, then the title beside it, then the dates.
     Two lines with the dates flung to the far side of a 1200px row left a
     void down the middle of every row, which is what he objected to. This
     is the shape brianlovin.com uses, and the thing that actually makes it
     work there is not the arrangement, it is that the column is 640px and
     not 1200: the gap has to read as a rail rather than a hole. So the row
     is capped narrow in the stylesheet, and that cap is the whole fix.

     The lead wraps, so the title drops under the agency by itself when
     there is no room for both. Under 900px the row stacks properly and the
     dates move above, which is the rule that was already there. */
  function rows(list) {
    return list.map(function (e) {
      return '<div class="exp-row">' +
        '<span class="exp-lead">' +
          '<span class="exp-org">' + orgHtml(e.org) + '</span>' +
          '<span class="exp-role">' + esc(e.role) + '</span>' +
        '</span>' +
        '<span class="exp-time">' + esc(e.time) + '</span>' +
        '</div>';
    }).join('');
  }

  /* ---- languages, and education ----
     Both are lists in content.js and both print nothing at all when the list
     is missing or empty, headings included: the same contract as the layout
     and the résumé button. Nothing on this page is ever a heading over air.

     The heading only appears once its list has rows, which is why the three
     of them start hidden. `Experience` is a heading the page never had, and
     it is needed now: with two dated lists stacked, an unlabelled one reads
     as a continuation of the one above it. */
  function fillBlock(headId, listId, html) {
    var head = document.getElementById(headId);
    var list = document.getElementById(listId);
    if (!list) return;
    list.innerHTML = html || '';
    if (head) head.hidden = !html;
  }
  var langs = (A.languages || []).filter(function (l) { return l && l.name && l.say; });
  fillBlock('langHead', 'langList', langs.map(function (l) {
    /* dir="auto" on the value: Arabic set inside a left-to-right row resolves
       its spaces and punctuation against the paragraph, not the words, and
       they end up on the wrong side of the line. */
    /* NAME first, level second: the language on the left and how well he
       speaks it on the right, which is his call and the way a language list
       is read. This was the other way round for one release because the
       order was fixed in the preview and the old markup was the version
       ported across. */
    return '<div class="lang-row">' +
      '<span class="lang-name">' + esc(l.name) + '</span>' +
      '<span class="lang-say" dir="auto">' + esc(l.say) + '</span>' +
      '</div>';
  }).join(''));
  /* ONE list: education and jobs in a single reverse-chronological run, so
     the newest and most relevant thing he has done sits at the top where a
     hirer looks first instead of in a separate block under the jobs.

     It is called EXPERIENCE, not Milestones (9 Sep 2026, his call). A
     milestone is a landmark you passed; a job is work you did. Every real
     portfolio and every CV convention calls this column experience, and a
     recruiter scanning for the word was not finding it. */
  var milestones = (A.education || []).concat(jobs);

  /* A row that is a link: the same three parts as a job row, so contact and
     the résumé read as more of the page rather than widgets dropped on it.
     Leaving the site opens a new tab; a mailto does not, and stays BARE so
     sweepMail() can put the half-written draft on it like every other
     address on the page (a link that already carries a query is hands-off). */
  function linkRow(lead, detail, right, href) {
    return '<a class="exp-row" href="' + esc(href) + '"' +
      (/^mailto:/i.test(href) ? '' : ' target="_blank" rel="noopener"') + '>' +
      '<span class="exp-lead">' +
        '<span class="exp-org"><b>' + lead + '</b></span>' +
        '<span class="exp-role">' + detail + '</span>' +
      '</span>' +
      '<span class="exp-time">' + right + '</span>' +
      '</a>';
  }

  /* ---- the résumé, as the last row of Experience (15 Sep 2026) ----
     It was a separate button with a shape of its own. The list it sits under
     is the short version of the résumé, so the full version belongs at the
     foot of that list. Straight out of contact.resume, admin section 6; no
     link in there and there is no row. */
  var R = (C.contact && C.contact.resume) || {};
  var resumeUrl = R.url ? String(R.url).trim() : '';
  fillBlock('expHead', 'expList', rows(milestones) +
    (resumeUrl ? linkRow('Résumé', 'The full version', 'Download &#8595;', resumeUrl) : ''));

  /* ---- Say hi, as rows ----
     Every contact link becomes a row. The detail is read off the URL, so
     admin stays the one place to edit: a LinkedIn slug, an Instagram handle,
     a Vimeo address. WhatsApp says "Message me" and never prints the number:
     the link reaches it already, and a phone number set in type on a public
     page is a gift to every scraper. The résumé's duplicate in
     contact.links is skipped by matching the URL, since it has its own row. */
  (function () {
    var box = document.getElementById('aboutContact');
    if (!box) return;
    function detailFor(l) {
      var u = String(l.url || ''), m;
      if (/^mailto:/i.test(u)) {
        return ['Email', esc(u.replace(/^mailto:/i, '').split('?')[0]), 'Write &#8599;'];
      }
      if (/wa\.me|whatsapp/i.test(u)) return ['WhatsApp', 'Message me', '&#8599;'];
      if ((m = /linkedin\.com\/in\/([^\/?#]+)/i.exec(u))) return ['LinkedIn', '/in/' + esc(m[1]), '&#8599;'];
      if ((m = /instagram\.com\/([^\/?#]+)/i.exec(u))) return ['Instagram', '@' + esc(m[1]), '&#8599;'];
      if ((m = /vimeo\.com\/([^\/?#]+)/i.exec(u))) return ['Vimeo', 'vimeo.com/' + esc(m[1]), '&#8599;'];
      return [esc(l.label || 'Link'), esc(u.replace(/^https?:\/\/(www\.)?/i, '').slice(0, 40)), '&#8599;'];
    }
    var html = ((C.contact && C.contact.links) || []).filter(function (l) {
      return l && l.url && String(l.url).trim() && String(l.url).trim() !== resumeUrl;
    }).map(function (l) {
      var d = detailFor(l);
      return linkRow(d[0], d[1], d[2], String(l.url).trim());
    }).join('');
    document.getElementById('contactRows').innerHTML = html;
    box.hidden = !html;
  })();

  /* ---- the ad ----
     His copy lives in about.ad (admin section 5), so he can rewrite it
     without touching this file. The picture a visitor uploads is scaled on
     a canvas and kept in localStorage on this origin: it is never uploaded,
     never in content.js, and nobody else can see it. That is the promise the
     ad makes, and it is funnier for being true. */
  (function () {
    var sky = document.getElementById('sky');
    if (!sky) return;
    var page = document.getElementById('abPage');
    var AD = A.ad || {};
    document.getElementById('skyTag').textContent = AD.tag || 'Ad space';
    document.getElementById('skyHead').textContent = AD.head || 'Nobody will see this.';
    document.getElementById('skyBody').textContent = AD.body || '';
    document.getElementById('skyCta').textContent = AD.cta || 'Upload yours';

    /* The headline shrinks until its LONGEST WORD fits. A skyscraper has
       about 130px of usable width and a split word reads as a bug; wrapping
       between words is fine. Same idea as fitHead() on the ticket. */
    function fitHead() {
      var head = document.getElementById('skyHead'), sell = head.parentNode;
      head.style.fontSize = '';
      var cs = getComputedStyle(sell);
      var avail = sell.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      if (!avail) return;
      var probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap';
      head.appendChild(probe);
      for (var pass = 0; pass < 4; pass++) {
        var widest = 0;
        String(head.firstChild ? head.firstChild.textContent : '').split(/\s+/).forEach(function (w) {
          probe.textContent = w;
          widest = Math.max(widest, probe.getBoundingClientRect().width);
        });
        if (widest <= avail) break;
        head.style.fontSize = Math.max(14, Math.floor(parseFloat(getComputedStyle(head).fontSize) * avail / widest)) + 'px';
      }
      probe.remove();
    }

    /* THE SHIFT. His ask: move the whole page right so it balances the ad.
       Balance is measured, not guessed: the space left of the content is made
       equal to the space between the content and the ad. It is measured from
       the grid, not the photo (the photo is rotated 1.6deg and its box pokes
       7px further left), and it never goes negative. Only while the ad is
       showing; under 1100px there is no ad and no shift. */
    function balance() {
      var rail = document.querySelector('.ab-rail');
      if (!rail || getComputedStyle(rail).display === 'none') {
        page.style.setProperty('--shift', '0px');
        return;
      }
      page.style.setProperty('--shift', '0px');
      var main = document.getElementById('abMain').getBoundingClientRect().width;
      var gap = parseFloat(getComputedStyle(page).columnGap) || 0;
      var content = document.getElementById('aboutText').getBoundingClientRect().right -
                    document.getElementById('abGrid').getBoundingClientRect().left;
      page.style.setProperty('--shift', Math.max(0, Math.round((main + gap - content) / 2)) + 'px');
    }

    var KEY = 'about:ad', live = document.getElementById('skyLive');
    var pick = document.getElementById('skyPick');
    function sold(url) {
      if (url) {
        document.getElementById('skyImg').src = url;
        sky.classList.add('is-sold');
        live.hidden = false;
        live.innerHTML = '<b>Live</b> &middot; reach: 1<br>In your browser only' +
          '<button class="sky-down" type="button" id="skyDown">Take it down</button>';
      } else {
        document.getElementById('skyImg').removeAttribute('src');
        sky.classList.remove('is-sold');
        live.hidden = true;
        live.innerHTML = '';
      }
    }
    /* Scaled before it is stored: a phone photo as a data URL can be several
       megabytes against about five for the whole origin. 480px wide covers
       the slot at 3x; the crop to the slot happens on screen, not here. */
    function shrink(file, cb) {
      var r = new FileReader();
      r.onload = function () {
        var im = new Image();
        im.onload = function () {
          var s = Math.min(1, 480 / (im.naturalWidth || 480));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.naturalWidth * s));
          c.height = Math.max(1, Math.round(im.naturalHeight * s));
          try { c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', 0.82)); }
          catch (e) { cb(String(r.result)); }
        };
        im.onerror = function () { cb(''); };
        im.src = String(r.result);
      };
      r.onerror = function () { cb(''); };
      r.readAsDataURL(file);
    }
    sky.addEventListener('click', function () { pick.value = ''; pick.click(); });
    pick.addEventListener('change', function () {
      var f = pick.files && pick.files[0];
      if (!f) return;
      shrink(f, function (url) {
        if (!url) return;
        sold(url);
        /* quota, a private window or storage switched off: it runs for this
           visit and is forgotten, which is a smaller problem than a dialog */
        try { localStorage.setItem(KEY, url); } catch (e) {}
      });
    });
    live.addEventListener('click', function (ev) {
      if (!ev.target.closest || !ev.target.closest('#skyDown')) return;
      try { localStorage.removeItem(KEY); } catch (e) {}
      sold('');
    });
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved) sold(saved);

    function settle() { fitHead(); balance(); }
    settle();
    window.addEventListener('load', settle);
    window.addEventListener('resize', settle);
    /* the fit means nothing in the fallback face: again once fonts arrive */
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle);
  })();
