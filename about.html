<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="page-nav">
  <div class="wrap">
    <a class="logo" href="index.html">mohammed essam<em>.</em></a>
    <div class="links">
      <a href="work.html">The work</a>
      <a href="about.html" class="on">Who I am</a>
      <a href="mailto:m22essam@gmail.com">Hire me</a>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="wrap"><h1 id="aboutHeading"></h1></div>
</header>

<div class="wrap">
  <div class="about-grid">
    <img class="about-portrait" id="aboutPortrait" src="" alt="">
    <div id="aboutText"></div>
  </div>
  <div class="exp-list" id="expList"></div>
</div>

<footer class="page-foot">
  <div class="wrap">
    <p class="big">Someone has to win eventually. <a href="mailto:m22essam@gmail.com">Go on.</a></p>
    <p class="terms" id="footTerms"></p>
    <p class="joke" id="footJoke"></p>
  </div>
</footer>

<script src="content.js"></script>
<script src="site.js"></script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT || {};
  var A = C.about || {};

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  document.getElementById('aboutHeading').textContent = A.heading || 'Who I am.';

  var portrait = document.getElementById('aboutPortrait');
  if (A.portrait) {
    portrait.src = window.imgSrc(A.portrait);
    portrait.alt = A.portraitAlt || 'Mohammed Essam';
  } else {
    portrait.style.display = 'none';
  }

  var box = document.getElementById('aboutText');
  var html = (A.paragraphs || []).map(function (t) {
    return '<p class="about-text">' + esc(t) + '</p>';
  }).join('');
  if ((A.skills || []).length) {
    html += '<div class="skills-list">' + A.skills.map(function (s) {
      return '<span class="skill-tag">' + esc(s) + '</span>';
    }).join('') + '</div>';
  }
  box.innerHTML = html;

  document.getElementById('expList').innerHTML = (A.experience || []).map(function (e) {
    return '<div class="exp-row">' +
      '<div><span class="exp-role">' + esc(e.role) + '</span><span class="exp-org">' + esc(e.org) + '</span></div>' +
      '<span class="exp-time">' + esc(e.time) + '</span>' +
      '</div>';
  }).join('');

  var termsEl = document.getElementById('footTerms');
  if (termsEl && C.ticket) termsEl.textContent = C.ticket.terms || '';

  /* the quiet jokes */
  var J = C.jokes || {};
  var fj = document.getElementById('footJoke');
  if (fj) fj.textContent = J.footer || '';
  if (J.tabAway) {
    var realTitle = document.title;
    document.addEventListener('visibilitychange', function () {
      document.title = document.hidden ? J.tabAway : realTitle;
    });
  }
  if (J.console && window.console) console.log('%c' + J.console, 'color:#E3261A;font-size:13px');
})();
</script>

</body>
</html>
