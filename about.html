<footer class="stub" id="siteFoot"></footer>

<!-- content.js is fetched with a stamp that changes every minute.
     GitHub Pages serves it with cache-control: max-age=600, so for ten
     minutes after a save the live site kept handing out the previous
     words and the save looked as though it had done nothing. A plain
     request was measured returning a fifty-minute-old copy while the
     same file, asked for with a query, came back current.
     Only on a real web server: a query string on a file URL is not
     reliably understood and the owner previews by double-clicking. -->
<script>
(function () {
  /* only on a real web server. Anything else (file://, and the data: URLs
     some preview panes use) gets exactly the tag this always had, so the
     double-click workflow cannot regress. */
  var v = /^https?:$/.test(location.protocol) ? '?v=' + Math.floor(Date.now() / 60000) : '';
  document.write('<scr' + 'ipt src="content.js' + v + '"><\/scr' + 'ipt>');
})();
</script>
<script src="site.js"></script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT || {};
  var A = C.about || {};

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---- language ----
     The shared helpers are in site.js, so this page and the project page use
     one copy of them. `has` is worked out from the content, not hard-coded:
     the switch appears because `about.ja` exists, and deleting that block
     takes the switch with it. */
  var has  = Object.keys(window.LANGS || {}).filter(function (k) {
    return A[k] && typeof A[k] === 'object';
  });
  var want = window.langWanted();
  var lang = (want && A[want]) ? want : '';
  var alt  = lang ? A[lang] : null;
  var say  = window.langPick(A, alt);
  var L    = lang ? window.LANGS[lang] : null;

  window.applyLang(lang);
  document.getElementById('aboutLang').innerHTML =
    window.langSwitch('about.html', has, lang);

  var heading = say('heading') || 'Who I am.';
  document.getElementById('aboutHeading').textContent = heading;
  /* the tab has to follow too, or a Japanese page sits behind an English tab */
  if (lang) document.title = String(heading).replace(/[.。]\s*$/, '') + ' · Mohammed Essam';

  var portrait = document.getElementById('aboutPortrait');
  /* ---- the portrait, and the rest of the roll ----
     `about.portraits` is a list; `about.portrait` is the old single field and
     still works, so nothing breaks if he never adds a second one. With more
     than one the frame becomes a shuffle: hovering steps to the next, and a
     click does the same, which is the only version that works on a phone
     where there is no hover at all. The swap is a hard cut, not a fade:
     the art direction is flat and a cross-fade would put a soft grey moment
     in the middle of two duotones. */
  var roll = (A.portraits && A.portraits.length ? A.portraits : [A.portrait])
    .filter(function (s) { return s && String(s).trim(); });

  if (roll.length) {
    var shot = document.getElementById('aboutShot');
    var seen = 0;
    portrait.src = window.imgSrc(roll[0]);
    portrait.alt = A.portraitAlt || 'Mohammed Essam';

    if (roll.length > 1) {
      /* decode them all up front, or the first swap is a blank frame */
      roll.slice(1).forEach(function (s) { new Image().src = window.imgSrc(s); });

      var step = function () {
        seen = (seen + 1) % roll.length;
        portrait.src = window.imgSrc(roll[seen]);
      };
      shot.classList.add('has-roll');
      shot.setAttribute('title', roll.length + ' photos. Hover or tap.');

      /* While the pointer is on it, it keeps going: one photograph a second
         until they leave. Desktop only, because a touch screen has no pointer
         to rest anywhere, and the tap below already steps it.

         Not under reduced motion either: content that changes itself on a
         timer is the thing that setting is asking us not to do. Those
         visitors still get the tap and the keyboard. */
      var hoverRoll = null;
      var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (canHover && !still) {
        shot.addEventListener('mouseenter', function () {
          step();                                   /* one straight away */
          clearInterval(hoverRoll);
          hoverRoll = setInterval(step, 1000);      /* then one a second */
        });
        shot.addEventListener('mouseleave', function () {
          clearInterval(hoverRoll);
          hoverRoll = null;
        });
        /* a tab switch leaves the pointer nowhere, so stop rather than run on
           in a page nobody is looking at */
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) { clearInterval(hoverRoll); hoverRoll = null; }
        });
      } else if (canHover) {
        shot.addEventListener('mouseenter', step);  /* reduced motion: one step */
      }

      shot.addEventListener('click', step);
      /* it is a control now, so it has to answer a keyboard too */
      shot.setAttribute('tabindex', '0');
      shot.setAttribute('role', 'button');
      shot.setAttribute('aria-label', 'Show the next photo');
      shot.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(); }
      });
    }
  } else {
    var empty = document.getElementById('aboutShot');
    if (empty) empty.style.display = 'none';
  }

  var box = document.getElementById('aboutText');
  var html = (say('paragraphs') || []).map(function (t) {
    return '<p class="about-text">' + esc(t) + '</p>';
  }).join('');
  var skills = say('skills') || [];
  /* the skills are a flat list of words, so they are swapped whole rather
     than merged by position: there is nothing on the English side that has
     to keep lining up with them */
  if (skills.length) {
    html += '<div class="skills-list">' + skills.map(function (s) {
      return '<span class="skill-tag">' + esc(s) + '</span>';
    }).join('') + '</div>';
  }
  box.innerHTML = html;

  /* the jobs ARE merged by position, and dropped whole if the two lists stop
     being the same length. See langRows() in site.js for why. */
  var jobs = window.langRows(A.experience, alt && alt.experience, ['role', 'org', 'time']);
  document.getElementById('expList').innerHTML = jobs.map(function (e) {
    return '<div class="exp-row">' +
      '<div><span class="exp-role">' + esc(e.role) + '</span><span class="exp-org">' + esc(e.org) + '</span></div>' +
      '<span class="exp-time">' + esc(e.time) + '</span>' +
      '</div>';
  }).join('');

  /* ---- the résumé ----
     Straight out of contact.resume, which is admin section 6, so the link and
     the words on the button are both his. No link in there and the button is
     not built at all, rather than sitting on the page going nowhere.
     It opens in its own tab because it leaves the site. */
  var R = (C.contact && C.contact.resume) || {};
  if (R.url && String(R.url).trim()) {
    document.getElementById('aboutResume').innerHTML =
      '<a class="resume-btn" href="' + esc(String(R.url).trim()) + '" target="_blank" rel="noopener">' +
        '<span>' + esc(R.label || 'Download my résumé') + '</span>' +
        '<span class="resume-arrow" aria-hidden="true">&#8595;</span>' +
      '</a>';
  }

  /* the footer stub, including its small print, is built by site.js */

  /* the quiet jokes */
  var J = C.jokes || {};
  if (J.tabAway) {
    var realTitle = document.title;
    document.addEventListener('visibilitychange', function () {
      document.title = document.hidden ? J.tabAway : realTitle;
    });
  }
  if (J.console && window.console) console.log('%c' + J.console, 'color:#E3261A;font-size:13px');
})();
</script>
