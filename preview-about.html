<!DOCTYPE html>
<!-- ============================================================
     THE ABOUT PAGE  ·  proposal, not live

     The rewritten bio, a languages block and an education block, drawn with
     the REAL stylesheet, the real content.js and the real site.js, so what
     is on screen is what the page would be rather than an impression of it.

     Every open decision is a switch in the bar at the top. Nothing here is
     published and about.html is untouched.

     THE DATES ON ASSIUT ARE PLACEHOLDERS. He has not given them yet. They
     are the only invented facts on this page and they are marked in the bar.
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>About, proposed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Barlow+Condensed:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* ---- the switch bar. Preview furniture, never part of the page. ---- */
.pbar{position:sticky;top:0;z-index:200;display:flex;flex-wrap:wrap;
      align-items:center;gap:0;background:#141414;
      border-bottom:3px solid #E8FF00;font-family:ui-monospace,monospace}
.pbar .g{display:flex;align-items:center;border-right:1px solid #ffffff2e}
.pbar b{color:#E8FF00;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
        padding:0 10px;font-weight:400}
.pbar button{font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  background:none;border:0;border-left:1px solid #ffffff24;color:#fff;
  padding:10px 12px;cursor:pointer}
.pbar button[aria-pressed="true"]{background:#E8FF00;color:#111}
.pnote{background:#332F00;color:#FFF3A8;font-family:ui-monospace,monospace;
       font-size:11px;line-height:1.6;padding:10px 16px}
.pnote b{color:#fff}

/* ---- PROPORTIONS AND ALIGNMENT ----

   Measured, three edges that did not line up:
     photo left 113, everything else 120        (the frame sits outside)
     language row right 480, photo right 487    (row narrower than the photo)
     milestones right 880, bio right 1134       (two rails on one page)

   The last one is the real fault. The page was two columns down to the bio
   and then a full-width band that stopped 254px short of it, so nothing
   agreed with anything. Milestones now sits in the right column under the
   bio, so the page is two columns all the way down and each column keeps its
   own edge. The row lands at about 590, which is nearer brianlovin's 640
   than the 760 was, and that width is the whole reason the gap between a
   title and its dates reads as a rail instead of a hole. */
body.page-about .about-grid{grid-template-columns:360px minmax(0,62ch);
  gap:64px;align-items:start;margin-bottom:0}
.about-shot{aspect-ratio:3/4}
body.page-about .exp-list{max-width:none;margin:34px 0 0}
body.page-about .exp-row{max-width:none}

/* ---- WIDE LISTS ----
   The two lists break out of the right column and run the full content
   width, so they share their right edge with the bio and start on the same
   left edge as the photograph. 1014 instead of 590.

   A wider row is a longer gap between a title and its date, and 1200 was
   once rejected here for exactly that: the space stopped reading as a rail
   and started reading as a hole. So at this width the row grows a ledger
   rule between the two, which is a device the ticket already owns. */
body.wide .lists{margin-left:-424px;width:1014px}
/* styles.css caps .lang-row at 760 and the override has to say so, or the
   two lists come out 254px apart while looking like one component */
body.wide .lang-row,body.wide .exp-row{max-width:none}
body.wide .exp-lead,body.wide .lang-name{position:relative}
body.wide .exp-row,body.wide .lang-row{position:relative}
body.wide .exp-row::after,body.wide .lang-row::after{
  content:"";position:absolute;left:0;right:0;bottom:15px;height:1px;
  background:var(--line);z-index:0}
body.wide .exp-lead,body.wide .exp-time,
body.wide .lang-name,body.wide .lang-say{
  position:relative;z-index:1;background:var(--bg);}
body.wide .exp-lead,body.wide .lang-name{padding-right:14px}
body.wide .exp-time,body.wide .lang-say{padding-left:14px}
@media (max-width:900px){
  body.wide .lists{margin-left:0;width:auto}
  body.wide .exp-row::after,body.wide .lang-row::after{display:none}
}

.blk-head{font-family:var(--mono);font-weight:700;font-size:11.5px;
          letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim);
          margin:0 0 2px}
.side-langs{margin-top:26px}
.under-ms{margin-top:38px}
.under-ms .lang-say{text-align:right}
.lang-list{margin:0}

/* The language is BOLD and the level is not, at his call, and it puts this
   block in the same shape as the milestones under it: display face and 800
   on the left, quiet type on the right. Two lists that behave the same. */
/* identical geometry to .exp-row: same padding, same gap, same rule, same
   space-between. Two lists that are the same component. */
.lang-row{display:flex;justify-content:space-between;align-items:baseline;
          gap:28px;padding:13px 0;border-top:1px solid var(--line)}
.lang-name{font-family:var(--display);font-weight:800;font-size:16px;
           letter-spacing:-.02em;color:var(--fg);flex:none}
.lang-say{font-family:var(--body);font-weight:400;color:var(--fg-dim);
          line-height:1.2;text-align:right;font-size:15px}
.lang-row:nth-child(1) .lang-say{font-size:17px}
.lang-row:nth-child(2) .lang-say{font-size:15.5px}
.lang-row:nth-child(3) .lang-say{font-size:14px}
.lang-row:nth-child(4) .lang-say{font-size:13px}
.lang-say[dir]{unicode-bidi:isolate}

body.shot-dots .about-portrait{filter:none;mix-blend-mode:normal}
body.shot-dots .about-shot canvas{position:absolute;inset:0;width:100%;
  height:100%;z-index:3}
body.shot-flat .about-portrait{filter:grayscale(1) contrast(1.15)}
body.shot-flat .about-shot{background:var(--bg)}

@media (max-width:900px){
  body.page-about .about-grid{grid-template-columns:1fr;gap:30px}
  .about-shot{aspect-ratio:4/5;margin-left:0}
  .side-langs{margin-top:20px}
}
</style>
</head>
<body class="page page-about">

<div class="pbar" id="pbar"></div>
<div class="pnote">
  Proposal only. <b>about.html and content.js are untouched.</b>
  The Assiut dates are placeholders: they are the only invented facts here.
</div>

<nav class="page-nav">
  <div class="wrap">
    <a class="logo" href="index.html">mohammed essam</a>
    <div class="links">
      <a href="work.html">The work</a>
      <a href="about.html" class="on">Who I am</a>
      <a href="mailto:m22essam@gmail.com">Say hi</a>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="wrap"><h1 id="aboutHeading"></h1></div>
</header>

<div class="wrap">
  <div class="about-grid">
    <div>
      <div class="about-shot" id="aboutShot">
        <img class="about-portrait" id="aboutPortrait" src="" alt="">
      </div>
      <div class="side-langs" id="langSide">
        <p class="blk-head">Languages</p>
        <div class="lang-list" id="langList"></div>
      </div>
    </div>
    <div>
      <div id="aboutText"></div>
      <div class="lists">
        <p class="blk-head" style="margin-top:38px">Milestones</p>
        <div class="exp-list" id="expList"></div>
        <div class="under-ms" id="langUnder"></div>
      </div>
    </div>
  </div>
</div>

<footer class="stub" id="siteFoot"></footer>

<script src="content.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT || {}, A = C.about || {};
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  

  /* the portrait roll, same as the real page */
  var roll = (A.portraits && A.portraits.length ? A.portraits : [A.portrait])
    .filter(function (s) { return s && String(s).trim(); });
  if (roll.length) {
    var p = $('aboutPortrait');
    p.src = window.imgSrc(roll[0]);
    p.alt = A.portraitAlt || 'Mohammed Essam';
    var seen = 0;
    roll.slice(1).forEach(function (s) { new Image().src = window.imgSrc(s); });
    $('aboutShot').addEventListener('click', function () {
      seen = (seen + 1) % roll.length; p.src = window.imgSrc(roll[seen]);
    });
  }

  /* ============================================================
     THE COPY. His words, with the four open decisions as switches.
     ============================================================ */
  var S = { assiut: 0, award: 0, langs: 1, steps: 1, edu: 0, geo: 0, brand: 0, head: 0, shot: 0, lpos: 1, wide: 1 };
  /* Everything here is either the site's own vocabulary or plain. The ticket
     already says "A red-tier ticket to the mind of MOHAMMED ESSAM" and "The
     ticket has no cash value", so this page can finish a sentence the home
     page started rather than open a new joke. */
  var HEADS = ['Read me?', 'Read me.', 'Since you’re here?',
               'Since you’re here.', 'The back of the ticket.',
               'No cash value.', 'The mind in question.',
               'The long version.', 'A little about me.'];

  /* His latest pass, with the mistakes he asked me to catch fixed and every
     fix listed back to him. No em dashes anywhere. */
  var PARA1 = [
    'I wanted to be a mechanical engineer, right up until I became one. ' +
    'So I shifted to sociology.',

    'I wanted to be a mechanical engineer, right up until Assiut University ' +
    'made me one. So I shifted to sociology.'
  ];
  /* his "but I enjoy the challenge" came off: it is a job-application phrase
     and it explained the joke instead of being one. "Pay to skip me" is his
     and it is the best thing in the paragraph, so it ends on it. */
  var PARA_WORK = 'Mechanical engineering taught me how machines work. ' +
                  'Sociology taught me how societies work. Neither prepared ' +
                  'me for people who pay to skip me.';
  var PARA_AD = [
    'Designed in Egypt, put to work in the UAE, and licensed in Madrid, ' +
    'which makes my buffet of ideas accidentally intercontinental.',

    'Designed in Egypt, put to work in the UAE, and licensed in Madrid, ' +
    'giving me a creative perspective that crosses borders by default.'
  ];
  var PARA_NOKIA = [
    'I have never used Nokia or Kodak as a cautionary tale in a presentation. ' +
    'Not once.',

    'I have never used Nokia or Fujifilm as a cautionary tale in a ' +
    'presentation. Not once.'
  ];
  /* the em dash is gone, and so is the clause after it: "which should tell
     you everything about my stubbornness" is a sentence explaining the
     sentence above it, which is the one crime this site keeps catching. */
  var PARA4 = 'I got my first bike at seven. I finally learned to balance on ' +
              'it at eighteen. Every photograph of me in between has my arm ' +
              'in a cast.';
  var PARA2 = [
    'I can be misunderstood in four languages.',
    ''
  ];

  var LANGS = [
    [['العربية', 'Arabic'],  'هايل ممتاز'],
    [['English', 'English'],                                     'i fully gotcha'],
    [['Español', 'Spanish'],                                'si leche normal'],
    [['Italiano', 'Italian'],                                    'english per favore']
  ];

  /* Assiut's years are NOT known. Marked so nobody mistakes them for facts. */
  var EDU = [
    { org: 'Miami Ad School, Madrid', role: 'Master’s in Copywriting', time: 'Oct 2025 – Sep 2026' },
    { org: 'Assiut University, Egypt', role: 'BA in Sociology', time: '20?? – 20??' },
    { org: 'Assiut University, Egypt', role: 'BSc in Mechanical Engineering', time: '20?? – 20??' }
  ];

  function orgHtml(org) {
    var s = String(org == null ? '' : org);
    var m = /[,，、(（]/.exec(s);
    return (m && m.index > 0)
      ? '<b>' + esc(s.slice(0, m.index)) + '</b>' +
        '<span class="exp-place">' + esc(s.slice(m.index)) + '</span>'
      : '<b>' + esc(s) + '</b>';
  }
  function rows(list) {
    return list.map(function (e) {
      return '<div class="exp-row"><span class="exp-lead">' +
        '<span class="exp-org">' + orgHtml(e.org) + '</span>' +
        '<span class="exp-role">' + esc(e.role) + '</span></span>' +
        '<span class="exp-time">' + esc(e.time) + '</span></div>';
    }).join('');
  }

  function paint() {
    var order = [PARA1[S.assiut], PARA_WORK, PARA_AD[S.geo],
                 PARA_NOKIA[S.brand], PARA4, PARA2[S.award]]
                 .filter(function (t) { return t; });
    var html = order
      .map(function (t) { return '<p class="about-text">' + esc(t) + '</p>'; }).join('');

    var skills = A.skills || [];
    if (skills.length) {
      var links = {};
      (A.skillLinks || []).forEach(function (l) {
        if (l && l.skill && l.url) links[String(l.skill).trim().toLowerCase()] = l.url;
      });
      html += '<div class="skills-list">' + skills.map(function (s) {
        var to = links[String(s).trim().toLowerCase()];
        return to ? '<a class="skill-tag is-link" href="' + esc(to) + '">' + esc(s) + '</a>'
                  : '<span class="skill-tag">' + esc(s) + '</span>';
      }).join('') + '</div>';
    }
    $('aboutText').innerHTML = html;

    $('langList').innerHTML = LANGS.map(function (l) {
      return '<div class="lang-row">' +
        '<span class="lang-name">' + esc(l[0][S.langs]) + '</span>' +
        '<span class="lang-say" dir="auto">' + esc(l[1]) + '</span></div>';
    }).join('');

    /* Option B leaves Assiut out of the block, because a row with no dates
       inside a list that has them reads as something withheld. The story in
       the first paragraph is then the only place it appears, which is where
       a reader expects no dates at all. */

    /* Socialize, Feb 2022 to Jun 2023, one month before We Are Social. His
       dates. It overlaps Social Nuts, which is flagged to him and not fixed
       here, because shortening a real job is his call and not mine. */
    /* his correction: Social Nuts Feb 2022 to Jul 2023, and no Socialize */
    var jobs = [EDU[0]].concat((A.experience || []).map(function (j) {
      return /social nuts/i.test(j.org || '')
        ? { org: j.org, role: j.role, time: 'Feb 2022 \u2013 Jul 2023' } : j;
    }));
    $('expList').innerHTML = rows(jobs);
    /* the whole languages block moves between the two columns, so the two
       positions can be compared rather than described */
    var side = $('langSide'), under = $('langUnder');
    if (S.lpos === 1) { under.appendChild(side); side.className = 'under-ms-in'; }
    else { $('aboutShot').parentNode.appendChild(side); side.className = 'side-langs'; }
    document.body.className = 'page page-about' +
      (S.shot === 1 ? ' shot-dots' : S.shot === 2 ? ' shot-flat' : '') +
      (S.wide ? ' wide' : '');
    if (S.shot === 1) dotScreen(); else clearDots();
    $('aboutHeading').textContent = HEADS[S.head];
  }

  var GROUPS = [
    ['Opening',   'assiut', [['Plain', 0], ['Names Assiut', 1]]],
    ['Lang labels',  'langs', [['Own language', 0], ['English', 1]]],
    ['Lang sizes',   'steps', [['Descending', 1], ['Flat', 0]]],
    ['Education',    'edu',   [['A: both listed', 0], ['B: Miami only', 1]]],
    ['Geography',    'geo',   [['Intercontinental', 0], ['Crosses borders', 1]]],
    ['Cautionary',   'brand', [['Kodak', 0], ['Fujifilm', 1]]],
    ['Languages line','award',[['Keep', 0], ['Cut', 1]]],
    ['Row width', 'wide', [['Wide, full page', 1], ['Narrow, in column', 0]]],
    ['Languages', 'lpos', [['Under the photo', 0], ['Under milestones', 1]]],
    ['Portrait', 'shot', [['Red screen, as now', 0], ['Halftone dots', 1],
                          ['Plain grey', 2]]],
    ['Heading', 'head', [['Read me?', 0], ['Read me.', 1],
                         ['Since you’re here?', 2], ['Since you’re here.', 3],
                         ['Back of ticket', 4], ['No cash value', 5],
                         ['Mind in question', 6], ['Long version', 7],
                         ['A little about me', 8]]]
  ];
  var bar = $('pbar');
  GROUPS.forEach(function (g) {
    var w = document.createElement('div');
    w.className = 'g';
    w.innerHTML = '<b>' + g[0] + '</b>';
    g[2].forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = o[0];
      b.setAttribute('aria-pressed', String(S[g[1]] === o[1]));
      b.addEventListener('click', function () {
        S[g[1]] = o[1];
        [].forEach.call(w.querySelectorAll('button'), function (x) {
          x.setAttribute('aria-pressed', String(x === b));
        });
        paint();
      });
      w.appendChild(b);
    });
    bar.appendChild(w);
  });

  /* the ticket's dot screen, run over the About portrait so he can see the
     two treatments side by side rather than imagine them */
  function clearDots() {
    var c = $('aboutShot').querySelector('canvas');
    if (c) c.remove();
  }
  function dotScreen() {
    var box = $('aboutShot'), img = $('aboutPortrait');
    if (!box || !img || !img.complete || !img.naturalWidth) return;
    clearDots();
    try {
      var w = box.clientWidth, h = box.clientHeight, pitch = 3;
      var cols = Math.max(8, Math.round(w / pitch)), rowsN = Math.max(8, Math.round(h / pitch));
      var read = document.createElement('canvas');
      read.width = cols; read.height = rowsN;
      var rx = read.getContext('2d');
      var sc = Math.max(cols / img.naturalWidth, rowsN / img.naturalHeight);
      var dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
      rx.drawImage(img, (cols - dw) / 2, (rowsN - dh) / 2, dw, dh);
      var d = rx.getImageData(0, 0, cols, rowsN).data;
      var out = document.createElement('canvas');
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      out.width = w * dpr; out.height = h * dpr;
      out.style.width = '100%'; out.style.height = '100%';
      var g = out.getContext('2d'); g.scale(dpr, dpr);
      var cs = getComputedStyle(document.documentElement);
      g.fillStyle = cs.getPropertyValue('--bg').trim() || '#F2EEE5';
      g.fillRect(0, 0, w, h);
      g.fillStyle = cs.getPropertyValue('--fg').trim() || '#0B0A09';
      var lums = new Float32Array(cols * rowsN), lo = 1, hi = 0;
      for (var n = 0; n < cols * rowsN; n++) {
        var q = n * 4;
        var L = (0.2126 * d[q] + 0.7152 * d[q + 1] + 0.0722 * d[q + 2]) / 255;
        lums[n] = L; if (L < lo) lo = L; if (L > hi) hi = L;
      }
      var span = Math.max(0.12, hi - lo);
      var cw = w / cols, ch = h / rowsN, maxR = Math.max(cw, ch) * 0.39;
      for (var y = 0; y < rowsN; y++) for (var x = 0; x < cols; x++) {
        var r = Math.pow(1 - (lums[y * cols + x] - lo) / span, 1.12) * maxR;
        if (r < 0.18) continue;
        g.beginPath(); g.arc((x + .5) * cw, (y + .5) * ch, r, 0, 6.2832); g.fill();
      }
      box.appendChild(out);
    } catch (e) {}
  }
  $('aboutPortrait').addEventListener('load', function () {
    if (S.shot === 1) setTimeout(dotScreen, 0);
  });

  paint();
})();
</script>
</body>
</html>
