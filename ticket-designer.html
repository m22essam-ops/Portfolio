<!DOCTYPE html>
<!-- ============================================================
     TICKET DESIGNER  ·  the home page only

     A second editor, deliberately separate from admin.html.

     admin.html owns the WORDS: content.js and images/, the two things that
     get published. This one owns the LOOK of one screen, writes exactly one
     file, ticket-design.js, and has no GitHub connection of any kind. That
     is not an oversight, it is the request: "no access to GitHub ... we will
     save it locally, and then we can decide if we want to make it public".

     It edits the real page. The ticket in the middle is
     preview-brutalist.html?only=home in an iframe, not a copy of it, so this
     tool cannot drift away from the thing it is editing. Both documents load
     the same ticket-design-apply.js, so a design means one thing.

     Needs the local server, for the same reason design.html does: an iframe
     opened over file:// is a foreign document and nothing here could reach
     inside it.   ->   http://127.0.0.1:8888/ticket-designer.html
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ticket designer</title>
<style>
:root{
  --chrome:#17171A; --chrome2:#1F1F23; --line:#33333A;
  --txt:#E7E5E0; --dim:#8E8C87; --hot:#E8FF00; --red:#E3261A;
  --guide:#00C2FF; --snap:#FF2BD1;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rail:346px; --rulr:24px; --top:46px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--txt);
     font:12px/1.45 var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- frame ---------- */
#app{display:grid;grid-template-rows:var(--top) 1fr;
     grid-template-columns:var(--rail) 1fr;height:100%}
#top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;
     background:var(--chrome2);border-bottom:1px solid var(--line)}
#top h1{font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:0;font-weight:400}
#top .sep{flex:1}
.tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
     border:1px solid var(--line);padding:3px 7px}
.tag.on{color:#0C0C0C;background:#7BE87B;border-color:#7BE87B}
.tag.off{color:#0C0C0C;background:#FF8A7A;border-color:#FF8A7A}

button.b{background:#26262B;border:1px solid var(--line);padding:6px 10px;cursor:pointer;
         font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
button.b:hover{background:#313138}
button.b[aria-pressed="true"]{background:var(--hot);color:#111;border-color:var(--hot)}
button.b.go{background:var(--hot);color:#111;border-color:var(--hot);font-weight:700}
button.b.go:hover{filter:brightness(1.08)}
button.b:disabled{opacity:.4;cursor:default}
button.b.warn:hover{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- left rail ---------- */
#rail{overflow-y:auto;overflow-x:hidden;background:var(--chrome2);
      border-right:1px solid var(--line)}
details.pan{border-bottom:1px solid var(--line)}
details.pan > summary{list-style:none;cursor:pointer;padding:10px 12px;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:8px;user-select:none}
details.pan > summary::-webkit-details-marker{display:none}
details.pan > summary::before{content:"+";width:9px;color:var(--hot)}
details.pan[open] > summary::before{content:"–"}
details.pan[open] > summary{color:var(--txt)}
.body{padding:2px 12px 14px}

.row{display:flex;align-items:center;gap:8px;margin:0 0 7px}
.row > label{flex:0 0 104px;color:var(--dim);font-size:10px;letter-spacing:.06em;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row > .in{flex:1;min-width:0;display:flex;gap:6px;align-items:center}
input[type=text],input[type=number],select,textarea{
  width:100%;min-width:0;background:#111114;border:1px solid var(--line);
  padding:5px 7px;font-size:11px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--hot);outline-offset:-1px}
input[type=text].dirty,textarea.dirty{border-color:var(--hot)}
textarea{resize:vertical;line-height:1.5}
input[type=color]{width:28px;height:26px;padding:0;border:1px solid var(--line);
                  background:#111114;cursor:pointer;flex:none}
input[type=range]{width:100%;accent-color:var(--hot)}
.note{color:var(--dim);font-size:10px;line-height:1.5;margin:6px 0 10px}
.note b{color:var(--txt);font-weight:400}
.hint{color:var(--hot);font-size:10px;margin:4px 0 8px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.mini{font-size:9.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;
      margin:12px 0 6px;border-top:1px solid var(--line);padding-top:9px}
.slotbtn{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid #26262B;padding:6px 4px;cursor:pointer;font-size:11px;color:var(--txt)}
.slotbtn:hover{background:#26262B}
.slotbtn[aria-current="true"]{background:var(--hot);color:#111}
.slotbtn i{float:right;font-style:normal;color:var(--hot);font-size:9px}
.slotbtn[aria-current="true"] i{color:#111}
.guiderow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.guiderow span{flex:0 0 18px;color:var(--dim)}
.pill{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#111;
      background:var(--hot);padding:1px 5px;margin-left:6px}

/* ---------- stage ---------- */
#stage{position:relative;overflow:hidden;background:#0E0E10;
       display:grid;grid-template-columns:var(--rulr) 1fr;grid-template-rows:var(--rulr) 1fr}
#corner{background:var(--chrome2);border-right:1px solid var(--line);
        border-bottom:1px solid var(--line)}
#rulerT,#rulerL{display:block;background:var(--chrome2)}
#rulerT{border-bottom:1px solid var(--line);cursor:ns-resize}
#rulerL{border-right:1px solid var(--line);cursor:ew-resize}
#scroller{overflow:auto;position:relative}
#wrap{transform-origin:0 0;position:relative}
#frame{display:block;border:0;background:var(--red)}
/* the overlay sits over the scroll viewport, not inside it, so a guide is
   always one pixel wide however far the artboard is zoomed out */
#overlay{position:absolute;left:var(--rulr);top:var(--rulr);right:0;bottom:0;
         overflow:hidden;pointer-events:none}
.gd{position:absolute;pointer-events:auto}
.gd.v{top:0;bottom:0;width:9px;margin-left:-4px;cursor:ew-resize}
.gd.h{left:0;right:0;height:9px;margin-top:-4px;cursor:ns-resize}
.gd::after{content:"";position:absolute;background:var(--guide)}
.gd.v::after{left:4px;top:0;bottom:0;width:1px}
.gd.h::after{top:4px;left:0;right:0;height:1px}
.gd:hover::after{background:#fff}
#snapx,#snapy{position:absolute;background:var(--snap);display:none}
#snapx{top:0;bottom:0;width:1px}
#snapy{left:0;right:0;height:1px}
#selbox{position:absolute;border:1px solid var(--hot);display:none;
        box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#selbox b{position:absolute;left:0;top:-17px;background:var(--hot);color:#111;
          font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;
          white-space:nowrap;font-weight:400}
/* the eight handles. pointer-events has to be turned back ON here: the
   overlay above them is none, and that inherits. */
.hdl{position:absolute;width:9px;height:9px;background:var(--hot);
     border:1px solid #111;pointer-events:auto;z-index:4}
.hdl.nw{left:-5px;top:-5px;cursor:nwse-resize}
.hdl.ne{right:-5px;top:-5px;cursor:nesw-resize}
.hdl.sw{left:-5px;bottom:-5px;cursor:nesw-resize}
.hdl.se{right:-5px;bottom:-5px;cursor:nwse-resize}
.hdl.n{left:50%;top:-5px;margin-left:-4.5px;cursor:ns-resize}
.hdl.s{left:50%;bottom:-5px;margin-left:-4.5px;cursor:ns-resize}
.hdl.w{left:-5px;top:50%;margin-top:-4.5px;cursor:ew-resize}
.hdl.e{right:-5px;top:50%;margin-top:-4.5px;cursor:ew-resize}
/* a box too small to hold them: keep the corners only, or the eight handles
   cover the element and it can never be clicked again */
#selbox.tiny .hdl.n,#selbox.tiny .hdl.s,
#selbox.tiny .hdl.w,#selbox.tiny .hdl.e{display:none}
#hovbox{position:absolute;outline:1px dashed rgba(232,255,0,.75);display:none}
#readout{position:absolute;right:8px;bottom:8px;background:#000C;color:var(--hot);
         padding:4px 8px;font-size:10px;letter-spacing:.08em;display:none}
#blocked{position:absolute;inset:var(--rulr) 0 0 var(--rulr);background:#0E0E10;
         display:none;place-items:center;padding:40px;text-align:center;z-index:5}
#blocked div{max-width:460px;line-height:1.7;color:var(--dim)}
#blocked b{color:var(--hot);display:block;margin-bottom:10px;letter-spacing:.16em;
           text-transform:uppercase;font-weight:400}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;
       background:#000;border:1px solid var(--hot);color:var(--txt);padding:9px 14px;
       font-size:11px;display:none;max-width:70vw}
#toast.bad{border-color:var(--red);color:#FFB9B2}
#recover{display:none;gap:8px;align-items:center;padding:8px 12px;background:#332F00;
         border-bottom:1px solid var(--line);font-size:10.5px;color:#FFF3A8}
</style>
</head>
<body>

<div id="app">
  <header id="top">
    <h1>Ticket designer</h1>
    <span class="tag">Home page only</span>
    <span class="tag" id="srv">checking server</span>
    <span class="sep"></span>
    <button class="b" id="undo" title="Cmd Z">Undo</button>
    <button class="b" id="redo" title="Shift Cmd Z">Redo</button>
    <button class="b" id="zoomOut">&minus;</button>
    <span class="tag" id="zoomN">100%</span>
    <button class="b" id="zoomIn">+</button>
    <button class="b" id="zoomFit">Fit</button>
    <button class="b warn" id="revert">Revert all</button>
    <span class="tag" id="state">no changes</span>
    <button class="b go" id="save">Save to folder</button>
  </header>

  <aside id="rail">
    <div id="recover">
      <span id="recoverTxt"></span>
      <button class="b" id="recoverYes">Restore</button>
      <button class="b" id="recoverNo">Discard</button>
    </div>
    <div id="panels"></div>
  </aside>

  <main id="stage">
    <div id="corner"></div>
    <canvas id="rulerT"></canvas>
    <canvas id="rulerL"></canvas>
    <div id="scroller">
      <div id="wrap"><iframe id="frame" title="The ticket"></iframe></div>
    </div>
    <div id="overlay">
      <div id="hovbox"></div>
      <div id="selbox"><b></b></div>
      <div id="snapx"></div><div id="snapy"></div>
      <div id="readout"></div>
    </div>
    <div id="blocked"><div></div></div>
  </main>
</div>

<div id="toast"></div>

<script>
(function () {
'use strict';

var $  = function (s) { return document.querySelector(s); };
var $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };

/* ============================================================
   1. THE DESIGN OBJECT

   Everything he changes lives in here and nowhere else. It is the whole
   contents of ticket-design.js, and the only thing this page can write.
   ============================================================ */
var BLANK = { version: 1, vars: {}, body: {}, text: {}, style: {}, offset: {},
              guides: { v: [], h: [] }, css: '' };
var D = clone(BLANK);
var SAVED = '';                 /* the design as it is on disk, for dirty state */
var SLOTS = [], SEL = null;
var frame, fdoc, fwin, ready = false;
var LS = 'ticketDesigner.draft';

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

/* deep-set with pruning: writing '' or undefined REMOVES the key rather than
   storing an empty string. An empty override still counts as an override and
   would show up as a change he did not make, and the applier would have to
   guess. Absent means untouched, everywhere, always. */
function set(path, val) {
  var p = path.split('.'), o = D, i;
  for (i = 0; i < p.length - 1; i++) { if (!o[p[i]]) o[p[i]] = {}; o = o[p[i]]; }
  var last = p[p.length - 1];
  if (val === '' || val === null || val === undefined) delete o[last];
  else o[last] = val;
  prune(D);
}
function get(path, dflt) {
  var p = path.split('.'), o = D, i;
  for (i = 0; i < p.length; i++) { if (o == null) return dflt; o = o[p[i]]; }
  return o === undefined ? dflt : o;
}
function prune(o) {
  for (var k in o) {
    if (!Object.prototype.hasOwnProperty.call(o, k)) continue;
    var v = o[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      prune(v);
      if (!Object.keys(v).length && k !== 'guides' && k !== 'vars' &&
          k !== 'body' && k !== 'text' && k !== 'style' && k !== 'offset') delete o[k];
    }
  }
}

/* ============================================================
   2. HISTORY
   A snapshot per committed change. Cheap: the design is a few hundred bytes.
   ============================================================ */
var HIST = [clone(D)], HIDX = 0, HTIMER = null;
function commit(immediate) {
  clearTimeout(HTIMER);
  var go = function () {
    if (eq(HIST[HIDX], D)) return;
    HIST = HIST.slice(0, HIDX + 1);
    HIST.push(clone(D));
    if (HIST.length > 80) HIST.shift();
    HIDX = HIST.length - 1;
    draftSave();
    paintState();
  };
  if (immediate) go(); else HTIMER = setTimeout(go, 350);
}
function undo() { if (HIDX > 0) { HIDX--; D = clone(HIST[HIDX]); afterHistory(); } }
function redo() { if (HIDX < HIST.length - 1) { HIDX++; D = clone(HIST[HIDX]); afterHistory(); } }
function afterHistory() { apply(); buildPanels(); drawGuides(); paintState(); draftSave(); }

function draftSave() {
  try { localStorage.setItem(LS, JSON.stringify({ t: Date.now(), d: D })); } catch (e) {}
}

/* ============================================================
   3. THE IFRAME
   ============================================================ */
function boot() {
  frame = $('#frame');
  frame.src = 'preview-brutalist.html?only=home';
  frame.addEventListener('load', function () {
    try {
      fdoc = frame.contentDocument; fwin = frame.contentWindow;
      if (!fdoc || !fdoc.body) throw new Error('no document');
      SLOTS = fwin.TICKET_SLOTS || [];
      if (!SLOTS.length) throw new Error('no slot table');
    } catch (e) {
      blocked();
      return;
    }
    ready = true;
    armFrame();
    sizeFrame();
    apply();
    buildPanels();
    fit();
    /* the webfonts land after load and move every measurement in there */
    if (fdoc.fonts && fdoc.fonts.ready) fdoc.fonts.ready.then(function () {
      sizeFrame(); drawAll();
    });
  });
}

function blocked() {
  $('#blocked').style.display = 'grid';
  $('#blocked div').innerHTML =
    '<b>Open this over the local server</b>' +
    'This page edits the real ticket by reaching inside it, and a page opened ' +
    'straight from the folder is not allowed to reach inside another one. ' +
    'Start the server, then open:<br><br>' +
    '<span style="color:#E8FF00">http://127.0.0.1:8888/ticket-designer.html</span>' +
    '<br><br>Same rule as design.html. Nothing is broken.';
}

/* the iframe has real links and a scratch panel that wants your pointer.
   In here a click means "select this", so the page is put in edit mode. */
function armFrame() {
  var s = fdoc.createElement('style');
  s.textContent =
    '*{cursor:default !important}' +
    '.scratch-in canvas{pointer-events:none}' +
    'a,button,input{pointer-events:auto}';
  fdoc.head.appendChild(s);

  fdoc.addEventListener('click', function (e) { e.preventDefault(); }, true);
  fdoc.addEventListener('mousemove', onFrameHover);
  fdoc.addEventListener('mouseleave', function () { $('#hovbox').style.display = 'none'; });
  fdoc.addEventListener('pointerdown', onFrameDown);
  fdoc.addEventListener('keydown', onKey);
  fwin.addEventListener('resize', function () { sizeFrame(); drawAll(); });
}

/* The frame is given BOTH its width and its height explicitly.

   It used to be measured: height 10px, read the document's scrollHeight,
   grow to that. That works for a page in normal flow and fails completely
   for the home ticket, which is `position:fixed` and fills its viewport. A
   fixed document has no scrollHeight to speak of, so the frame stayed at
   10px and the editor showed a black stage with a sliver of card in it.

   Measured is also the wrong idea even when it works. The live home page is
   96vw by 96vh of HIS SCREEN, so the only frame that shows him the truth is
   one shaped like his screen. The height is the artboard width divided by
   the aspect ratio of his own browser window. */
var ARTW = 1400;
function frameHeight() {
  var a = window.innerWidth / Math.max(1, window.innerHeight);
  /* clamped, so a freak window shape cannot hand the editor a frame that is
     a strip or a tower */
  a = Math.max(0.5, Math.min(3, a));
  return Math.round(ARTW / a);
}
function sizeFrame() {
  if (!ready) return;
  var h = frameHeight();
  frame.style.width = ARTW + 'px';
  frame.style.height = h + 'px';
  $('#wrap').style.width = ARTW + 'px';
  $('#wrap').style.height = h + 'px';
  var s = $('#scroller');
  s.scrollLeft = s.scrollLeft;         /* keep it in range after a resize */
}

function apply() {
  if (!ready) return;
  try { fwin.applyTicketDesign(D, fdoc); } catch (e) {}
  /* words and sizes change the height of the card */
  requestAnimationFrame(function () { sizeFrame(); drawAll(); });
}

/* ============================================================
   4. COORDINATES

   Doc space  = pixels inside the iframe, origin at the iframe's top-left.
   Card space = the same, minus the ticket's own top-left. The rulers read in
                card space, because that is the thing he is aligning inside.
   Screen     = pixels in the overlay, which is the scroll viewport.
   ============================================================ */
var zoom = 1;
function origin() {
  if (!ready) return { x: 0, y: 0 };
  var t = fdoc.querySelector('.ticket');
  if (!t) return { x: 0, y: 0 };
  var r = t.getBoundingClientRect();
  return { x: r.left, y: r.top };
}
function scr() { var s = $('#scroller'); return { x: s.scrollLeft, y: s.scrollTop }; }
function docToScreen(x, y) { var s = scr(); return { x: x * zoom - s.x, y: y * zoom - s.y }; }
function screenToDoc(x, y) { var s = scr(); return { x: (x + s.x) / zoom, y: (y + s.y) / zoom }; }

function setZoom(z, keepCentre) {
  var s = $('#scroller'), old = zoom;
  zoom = Math.max(0.15, Math.min(2, z));
  var cx = (s.scrollLeft + s.clientWidth / 2) / old;
  var cy = (s.scrollTop + s.clientHeight / 2) / old;
  $('#wrap').style.transform = 'scale(' + zoom + ')';
  $('#wrap').style.width = (ARTW * zoom) + 'px';
  $('#wrap').style.height = (parseFloat(frame.style.height || 0) * zoom) + 'px';
  /* the wrap is scaled from its top-left, so it no longer reserves the room
     it takes. Its box is set in scaled pixels and the iframe inside keeps its
     own size; without this the scrollbars describe the wrong artboard. */
  if (keepCentre !== false) {
    s.scrollLeft = cx * zoom - s.clientWidth / 2;
    s.scrollTop = cy * zoom - s.clientHeight / 2;
  }
  $('#zoomN').textContent = Math.round(zoom * 100) + '%';
  drawAll();
}
function fit() {
  var s = $('#scroller');
  /* both axes: the frame is as tall as his screen's shape makes it, so
     fitting on width alone put the footer below the fold */
  var h = parseFloat(frame.style.height) || frameHeight();
  setZoom(Math.min(1, (s.clientWidth - 24) / ARTW, (s.clientHeight - 24) / h), false);
  s.scrollLeft = 0; s.scrollTop = 0;
  drawAll();
}

/* ============================================================
   5. RULERS
   ============================================================ */
function drawRulers() {
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var s = $('#scroller'), o = origin(), sc = scr();
  [['#rulerT', true], ['#rulerL', false]].forEach(function (p) {
    var c = $(p[0]), horiz = p[1];
    var W = horiz ? s.clientWidth : 24, H = horiz ? 24 : s.clientHeight;
    if (!W || !H) return;
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    var g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#1F1F23'; g.fillRect(0, 0, W, H);
    g.font = '9px ui-monospace,monospace';
    g.textBaseline = 'top';

    /* the tick step is chosen in CARD pixels but drawn in screen pixels, so
       zooming out thins the ladder instead of turning it into a grey bar */
    var span = (horiz ? W : H) / zoom;
    var step = 10;
    [10, 20, 50, 100, 200, 500].some(function (n) { step = n; return span / n < 34; });
    var big = step * 5;
    var from = Math.floor(((horiz ? sc.x : sc.y) / zoom - (horiz ? o.x : o.y)) / step) * step;
    var to = from + span + step;
    for (var v = from; v <= to; v += step) {
      var d = v + (horiz ? o.x : o.y);
      var px = Math.round(d * zoom - (horiz ? sc.x : sc.y)) + 0.5;
      if (px < 0 || px > (horiz ? W : H)) continue;
      var major = Math.abs(v % big) < 0.001;
      g.strokeStyle = v === 0 ? '#E8FF00' : (major ? '#5A5A63' : '#3A3A42');
      g.beginPath();
      if (horiz) { g.moveTo(px, major ? 8 : 16); g.lineTo(px, 24); }
      else { g.moveTo(major ? 8 : 16, px); g.lineTo(24, px); }
      g.stroke();
      if (major) {
        g.fillStyle = v === 0 ? '#E8FF00' : '#8E8C87';
        if (horiz) g.fillText(String(v), px + 2, 1);
        else {
          g.save(); g.translate(1, px + 2); g.rotate(-Math.PI / 2);
          g.textAlign = 'right'; g.fillText(String(v), 0, 0); g.restore();
        }
      }
    }
  });
}

/* ============================================================
   6. GUIDES
   Stored in CARD space, so a guide keeps its meaning when the artboard is
   re-measured, zoomed, or the card changes height.
   ============================================================ */
function drawGuides() {
  var ov = $('#overlay'), o = origin();
  $$('.gd').forEach(function (g) { g.remove(); });
  ['v', 'h'].forEach(function (axis) {
    (D.guides[axis] || []).forEach(function (val, i) {
      var el = document.createElement('div');
      el.className = 'gd ' + axis;
      var p = docToScreen(val + o.x, val + o.y);

  });
}

}

        if (!ev.buttons) { up(ev); return; }   /* never on a bare hover */
        var sx = ev.clientX - ov.left, sy = ev.clientY - ov.top;

/* ============================================================
   7. SELECTION, HOVER, DRAG

  b.style.left = p.x + 'px'; b.style.top = p.y + 'px';

/* ---------------- RESIZE ----------------
   Eight handles on the selection. What a drag WRITES depends on what the
   element is, because setting a width on a grid column does nothing at all:
   the track owns the width, not the item in it. So the three columns rewrite

   touching as fr, so the ticket stays fluid. */
var HANDLES = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];

function buildHandles() {
  var box = $('#selbox');
  HANDLES.forEach(function (h) {
    var i = document.createElement('i');
    i.className = 'hdl ' + h;
    i.dataset.h = h;
    box.appendChild(i);
  });
  box.addEventListener('pointerdown', function (e) {
    var h = e.target && e.target.dataset && e.target.dataset.h;
    if (h) startResize(h, e);

function gridTemplate(idx, px) {
  var cur = (get('style.grid.gridTemplateColumns', '') || '1fr 3fr 1fr').trim();
  var parts = cur.split(/\s+/);
  if (parts.length !== 3) parts = ['1fr', '3fr', '1fr'];

/* the edges available to snap to, in doc space, minus the element moving */

  var o = origin(), vs = [], hs = [];
  (D.guides.v || []).forEach(function (v) { vs.push(v + o.x); });
  (D.guides.h || []).forEach(function (v) { hs.push(v + o.y); });
  var t = fdoc.querySelector('.ticket');
  if (t) {
    var tr = t.getBoundingClientRect();
    vs.push(tr.left, tr.right, tr.left + tr.width / 2);
    hs.push(tr.top, tr.bottom, tr.top + tr.height / 2);

  SLOTS.forEach(function (s) {
    if (s.k === SEL) return;
    var m = fdoc.querySelector(s.sel); if (!m) return;
    var r = m.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    vs.push(r.left, r.right); hs.push(r.top, r.bottom);

function snapTo(list, value) {
  var TOL = 6 / zoom, best = null;
  list.forEach(function (v) {
    var d = v - value;
    if (Math.abs(d) <= TOL && (best === null || Math.abs(d) < Math.abs(best.d)))
      best = { d: d, line: v };

}

function startResize(h, e) {

  e.preventDefault(); e.stopPropagation();

  var el = fdoc.querySelector(slot.sel);

  var start = { x: e.clientX, y: e.clientY };
  var off0 = get('offset.' + SEL, { x: 0, y: 0 });
  var base = { x: +off0.x || 0, y: +off0.y || 0 };
  var col = GRIDCOL[SEL] === undefined ? -1 : GRIDCOL[SEL];
  var grid = fdoc.querySelector('.tk-grid');

  var horiz = h.indexOf('e') > -1 || h.indexOf('w') > -1;
  var vert = h.indexOf('n') > -1 || h.indexOf('s') > -1;

  var move = function (ev) {
    if (!ev.buttons) { up(); return; }
    var dx = (ev.clientX - start.x) / zoom, dy = (ev.clientY - start.y) / zoom;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
    moved = true; dragging = true;

    /* snap the edge that is actually moving, not the box */
    var sx = $('#snapx'), sy = $('#snapy');
    sx.style.display = 'none'; sy.style.display = 'none';
    if (horiz && !ev.altKey) {
      var edgeX = (h.indexOf('e') > -1 ? r0.right : r0.left) + dx;
      var gx = snapTo(edges.v, edgeX);
      if (gx) {
        dx += gx.d;
        var px = docToScreen(gx.line, 0);
        sx.style.display = 'block'; sx.style.left = px.x + 'px';
      }
    }
    if (vert && !ev.altKey) {
      var edgeY = (h.indexOf('s') > -1 ? r0.bottom : r0.top) + dy;
      var gy = snapTo(edges.h, edgeY);
      if (gy) {
        dy += gy.d;

        sy.style.display = 'block'; sy.style.top = py.y + 'px';

    }

    var w = r0.width, ht = r0.height, ox = base.x, oy = base.y;
    if (h.indexOf('e') > -1) w = r0.width + dx;
    if (h.indexOf('w') > -1) { w = r0.width - dx; ox = base.x + dx; }
    if (h.indexOf('s') > -1) ht = r0.height + dy;
    if (h.indexOf('n') > -1) { ht = r0.height - dy; oy = base.y + dy; }

    el.style.minHeight = ''; el.style.transform = '';

  };
  [fwin, window].forEach(function (wv) {
    wv.addEventListener('pointermove', move);
    wv.addEventListener('pointerup', up);
    wv.addEventListener('pointercancel', up);

var dragging = false;
function onFrameDown(e) {

  var was = get('offset.' + s.k, { x: 0, y: 0 });

  var move = function (ev) {
    /* The one rule that makes a hover incapable of moving anything: no

    w.addEventListener('pointercancel', up);
  });

}

/* Snapping. Candidates are the guides, the ticket's own edges and centre,

function snap(r0, base, want) {

  else sx.style.display = 'none';
  if (bestY) { out.y += bestY.d; var q = docToScreen(0, bestY.line);

  var n = get('offset.' + SEL, null);
  if (n && !n.x && !n.y) set('offset.' + SEL, null);

function drawAll() { drawRulers(); drawGuides(); drawSel(); }

/* ============================================================
   8. THE PANELS
   Rebuilt from the slot table, so a new row in ticket-design-apply.js is a
   new control in here with no second edit.

function computed(k, prop) {

}
function origText(k) {

  return m.getAttribute('data-orig') || '';
}

function el(tag, cls, txt) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;

}
/* el() sets textContent, which is right for everything except the notes,

function note(html) {

}

}

function fText(path, placeholder, unit) {

  if (i.value) i.className = 'dirty';
  i.addEventListener('input', function () {
    set(path, withUnit(i.value, unit));
    i.className = i.value.trim() ? 'dirty' : '';
    apply(); commit();
  });

}

  function push(v) {
    set(path, v);
    tx.value = v; tx.className = v ? 'dirty' : '';
    apply(); commit();
  }
  sw.addEventListener('input', function () { push(sw.value); });
  tx.addEventListener('input', function () {
    var v = tx.value.trim();
    set(path, v); tx.className = v ? 'dirty' : '';
    if (/^#[0-9a-f]{6}$/i.test(v)) sw.value = v;
    apply(); commit();
  });
  box.appendChild(sw); box.appendChild(tx);
  return box;
}
function hex(v) {
  v = String(v).trim();
  if (/^#[0-9a-f]{6}$/i.test(v)) return v;
  if (/^#[0-9a-f]{3}$/i.test(v))
    return '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
  return '#000000';
}
function fRange(path, min, max, step, fallback, unit) {
  var box = el('div', 'in');
  var r = document.createElement('input'); r.type = 'range';
  r.min = min; r.max = max; r.step = step;
  var n = document.createElement('input'); n.type = 'text';
  n.style.flex = '0 0 62px';
  var cur = get(path, '');
  r.value = parseFloat(cur === '' ? fallback : cur);
  n.value = cur; n.placeholder = String(fallback);
  if (cur) n.className = 'dirty';
  /* the slider hands over a bare number, so the perforation sliders were
     writing `--perfR: 9` into a `radial-gradient(circle var(--perfR) ...)`
     and the holes never changed size */
  r.addEventListener('input', function () {
    set(path, withUnit(r.value, unit));
    n.value = withUnit(r.value, unit); n.className = 'dirty'; apply(); commit();
  });
  n.addEventListener('input', function () {
    set(path, withUnit(n.value, unit)); n.className = n.value.trim() ? 'dirty' : '';
    if (n.value !== '' && isFinite(parseFloat(n.value))) r.value = parseFloat(n.value);
    apply(); commit();
  });
  box.appendChild(r); box.appendChild(n);
  return box;
}
/* A slider that writes the text-stroke shorthand, because the value is a
   width AND a colour and a bare number is not a stroke. currentColor so it
   follows whatever ink the element already has. */
function fStroke(path) {
  var box = el('div', 'in');
  var r = document.createElement('input'); r.type = 'range';
  r.min = 0; r.max = 2; r.step = 0.05;
  var n = document.createElement('input'); n.type = 'text';
  n.style.flex = '0 0 62px';
  var cur = parseFloat(get(path, '')) || 0;
  r.value = cur; n.value = cur ? cur : ''; n.placeholder = '0';
  if (cur) n.className = 'dirty';
  function push(v) {
    v = parseFloat(v) || 0;
    set(path, v > 0 ? v + 'px currentColor' : null);
    n.className = v > 0 ? 'dirty' : '';
    apply(); commit();
  }
  r.addEventListener('input', function () { n.value = r.value; push(r.value); });
  n.addEventListener('input', function () {
    if (n.value !== '' && isFinite(parseFloat(n.value))) r.value = parseFloat(n.value);
    push(n.value);
  });
  box.appendChild(r); box.appendChild(n);
  return box;
}

    s.appendChild(op);

  s.addEventListener('change', function () { set(path, s.value); apply(); commit(true); });

}

/* What is actually in images/, read once and kept.

   The server lists a directory when there is no index.html in it, so this
   asks it rather than keeping a hand-written list that would go stale the
   first time he drops a photo in. Both folders, because content.js already
   points at live/ for the agency work and those are legitimate choices here.
   A failure is not fatal: the text field beside the picker still takes any
   name at all. */
var IMGCACHE = null;
function imageList() {
  if (IMGCACHE) return IMGCACHE;
  var ok = /\.(jpe?g|png|webp|gif|avif)$/i;
  var read = function (path, label, prefix) {
    return fetch(path + '?t=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        var files = [], m, re = /href="([^"?]+)"/gi;
        while ((m = re.exec(html))) {
          var n = decodeURIComponent(m[1]).replace(/^.*\//, '');
          if (ok.test(n) && files.indexOf(prefix + n) < 0) files.push(prefix + n);
        }
        files.sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
        return { label: label, files: files };
      })
      .catch(function () { return { label: label, files: [] }; });
  };
  IMGCACHE = Promise.all([
    read('images/', 'His own uploads', ''),
    read('images/live/', 'From the old site', 'live/')
  ]).then(function (gs) {
    if (!gs[0].files.length && !gs[1].files.length) throw new Error('no listing');
    return gs;
  });
  return IMGCACHE;
}

function touched(k) {
  return !!(D.text[k] !== undefined || D.style[k] || (D.offset[k] &&
            (D.offset[k].x || D.offset[k].y)));
}
function rootVar(name) {
  if (!ready) return '';
  return fwin.getComputedStyle(fdoc.documentElement).getPropertyValue(name).trim();
}

function source() {
  return '/* Written by ticket-designer.html on ' +
         new Date().toISOString().slice(0, 16).replace('T', ' ') + '.\n' +
         '   Do not edit by hand: the next save from the designer replaces this\n' +
         '   whole file. Empty, or deleted, means the ticket is exactly what\n' +
         '   preview-brutalist.html draws. */\n' +
         'window.TICKET_DESIGN = ' + JSON.stringify(D, null, 2) + ';\n';
}
function endpoint() {
  return (location.protocol === 'http:' || location.protocol === 'https:')
    ? location.origin + '/api/design'
    : 'http://127.0.0.1:8888/api/design';
}
function save() {
  var src = source();
  $('#save').disabled = true;
  fetch(endpoint(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: src })
  }).then(function (r) {
    if (r.status === 404) throw new Error('old-server');
    return r.json();
  }).then(function (j) {
    if (!j.ok) throw new Error(j.error || 'refused');
    SAVED = JSON.stringify(D);
    try { localStorage.removeItem(LS); } catch (e) {}
    paintState();
    toast('Saved. ticket-design.js, ' + j.bytes + ' bytes.');
  }).catch(function (e) {
    if (String(e.message) === 'old-server') {
      /* the endpoint is new, so a server started before today does not have
         it. Say exactly that rather than "save failed", and hand him the
         file anyway so the work is never trapped in a tab. */
      download(src);
      toast('Your server is the old one and has no place to put this. The file ' +
            'has downloaded instead: quit the server, run Start Site.command ' +
            'again, and Save will write it properly.', true);
    } else {
      download(src);
      toast('Could not reach the server, so the file downloaded instead. ' +
            'Move ticket-design.js into the portfolio folder.', true);
    }
  }).then(function () { $('#save').disabled = false; });
}
function download(src) {
  var b = new Blob([src], { type: 'text/javascript' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'ticket-design.js';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function toast(msg, bad) {
  var t = $('#toast');
  t.textContent = msg; t.className = bad ? 'bad' : '';
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.style.display = 'none'; }, bad ? 10000 : 3200);
}
function paintState() {
  var dirty = JSON.stringify(D) !== SAVED;
  var n = 0;
  ['text', 'style', 'offset', 'vars'].forEach(function (k) {
    n += Object.keys(D[k] || {}).length;
  });
  n += (D.guides.v || []).length + (D.guides.h || []).length;
  ['photo', 'photoDots', 'photoZoom', 'photoX', 'photoY'].forEach(function (k) {
    if (D[k]) n++;
  });
  $('#state').textContent = dirty ? 'unsaved' : (n ? n + ' set' : 'no changes');
  $('#state').className = 'tag' + (dirty ? ' off' : (n ? ' on' : ''));
  $('#undo').disabled = HIDX <= 0;
  $('#redo').disabled = HIDX >= HIST.length - 1;
}

/* ============================================================
   10. WIRING
   ============================================================ */
function serverCheck() {
  /* an image, not a fetch: from file:// a fetch has to clear CORS and a
     blocked one reads exactly like a server that is down. Same reason
     renderPortraitNote() in admin does it this way. */
  var tag = $('#srv');
  var im = new Image();
  im.onload = function () { tag.textContent = 'server up'; tag.className = 'tag on'; };
  im.onerror = function () { tag.textContent = 'no server'; tag.className = 'tag off'; };
  im.src = (location.protocol.indexOf('http') === 0 ? '' : 'http://127.0.0.1:8888/') +
           'favicon.png?t=' + Date.now();
}

function loadFromFile() {
  /* the file on disk is the truth on open. A draft in this browser is only
     ever offered, never taken: silently restoring one is how an old tab
     overwrites work done somewhere else, which has already happened once on
     this site through admin. */
  var s = document.createElement('script');
  s.src = 'ticket-design.js?t=' + Date.now();
  s.onload = s.onerror = function () {
    var fromFile = window.TICKET_DESIGN;
    if (fromFile && typeof fromFile === 'object') {
      D = Object.assign(clone(BLANK), fromFile);
      D.guides = Object.assign({ v: [], h: [] }, fromFile.guides || {});
    }
    SAVED = JSON.stringify(D);
    HIST = [clone(D)]; HIDX = 0;
    offerDraft();
    boot();
    paintState();
  };
  document.head.appendChild(s);
}

function offerDraft() {
  var raw = null;
  try { raw = localStorage.getItem(LS); } catch (e) {}
  if (!raw) return;
  var j;
  try { j = JSON.parse(raw); } catch (e) { return; }
  if (!j || !j.d || eq(j.d, D)) { try { localStorage.removeItem(LS); } catch (e) {} return; }
  var box = $('#recover');
  box.style.display = 'flex';
  /* formatted by hand: toLocaleString() here rendered "21:15:10 PM", a
     24-hour clock with an am/pm on the end of it */
  var t = new Date(j.t), p = function (n) { return (n < 10 ? '0' : '') + n; };
  $('#recoverTxt').textContent = 'Unsaved changes from ' +
    t.getDate() + '/' + (t.getMonth() + 1) + ' at ' +
    p(t.getHours()) + ':' + p(t.getMinutes()) + ' are still here.';
  $('#recoverYes').onclick = function () {
    D = Object.assign(clone(BLANK), j.d);
    D.guides = Object.assign({ v: [], h: [] }, j.d.guides || {});
    box.style.display = 'none';
    apply(); buildPanels(); drawAll(); commit(true);
  };
  $('#recoverNo').onclick = function () {
    try { localStorage.removeItem(LS); } catch (e) {}
    box.style.display = 'none';
  };
}

$('#save').addEventListener('click', save);
$('#undo').addEventListener('click', undo);
$('#redo').addEventListener('click', redo);
$('#zoomIn').addEventListener('click', function () { setZoom(zoom * 1.25); });
$('#zoomOut').addEventListener('click', function () { setZoom(zoom / 1.25); });
$('#zoomFit').addEventListener('click', fit);
$('#revert').addEventListener('click', function () {
  if (!confirm('Put every value back to the way the ticket was drawn?\n\n' +
               'Your guides go too. This does not save; the file on disk is ' +
               'unchanged until you press Save.')) return;
  D = clone(BLANK);
  apply(); buildPanels(); drawAll(); commit(true);
});

$('#scroller').addEventListener('scroll', drawAll);
/* his window's shape IS the artboard's shape, so resizing the editor has to
   reshape the frame, not just redraw the rulers over it */
window.addEventListener('resize', function () { sizeFrame(); fit(); });

/* Bound to BOTH documents. Clicking the ticket puts focus inside the iframe,
   and a key pressed there is delivered to that document only, so a handler on
   the parent alone meant the arrow keys did nothing for the entire time you
   were actually looking at the thing you wanted to move. */
function onKey(e) {
  var t = e.target && e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') {
    /* clicking a line puts the cursor in its words, which is what he asked
       for, and that is also where the arrow keys then go. Escape hands the
       keyboard back to the canvas without losing the selection, so nudging
       is one key away rather than a hunt for somewhere neutral to click. */
    if (e.key === 'Escape') { e.preventDefault(); e.target.blur(); drawSel(); }
    return;
  }
  var meta = e.metaKey || e.ctrlKey;
  if (meta && e.key.toLowerCase() === 'z') {
    e.preventDefault(); e.shiftKey ? redo() : undo(); return;
  }
  if (meta && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }

  /* step through the elements without the mouse */
  if (e.key === 'Tab') {
    e.preventDefault();
    var pickable = SLOTS.filter(function (s) { return fdoc.querySelector(s.sel); });
    if (!pickable.length) return;
    var at = pickable.map(function (s) { return s.k; }).indexOf(SEL);
    /* + length only, to keep a backwards step positive. An extra +1 in here
       made tab move two at a time and shift-tab stand still. */
    var next = (at + (e.shiftKey ? -1 : 1) + pickable.length) % pickable.length;
    if (at === -1) next = e.shiftKey ? pickable.length - 1 : 0;
    select(pickable[next].k);
    scrollSelIntoView();
    return;
  }
  if (e.key === 'Escape') { SEL = null; buildPanels(); drawSel(); return; }
  if (!SEL) return;

  var d = e.shiftKey ? 10 : 1;
  var map = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, -d], ArrowDown: [0, d] };
  if (map[e.key]) { e.preventDefault(); nudge(map[e.key][0], map[e.key][1]); return; }
  /* put one element back where it was drawn, without hunting for the button */
  if (e.key === '0' && meta) { e.preventDefault(); set('offset.' + SEL, null);
                               apply(); commit(true); buildPanels(); }
}
document.addEventListener('keydown', onKey);

/* keep a keyboard-selected element on screen */
function scrollSelIntoView() {
  var r = SEL ? rectOf(SEL) : null;
  if (!r) return;
  var s = $('#scroller');
  var p = docToScreen(r.left, r.top);
  if (p.y < 0) s.scrollTop += p.y - 20;
  else if (p.y + r.height * zoom > s.clientHeight) {
    s.scrollTop += (p.y + r.height * zoom) - s.clientHeight + 20;
  }
  drawAll();
}

window.addEventListener('beforeunload', function (e) {
  if (JSON.stringify(D) !== SAVED) { e.preventDefault(); e.returnValue = ''; }
});

buildHandles();
armRulers();
serverCheck();
loadFromFile();
})();
</script>
</body>
