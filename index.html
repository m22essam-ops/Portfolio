<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammed Essam — Award-losing copywriter</title>
<meta name="description" content="Mohammed Essam, copywriter. Cairo, Dubai, Madrid. Work that ran, and work that didn't.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Syne:wght@400..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="is-home">

<!-- THE WAY IN
     The ticket's own perforation is punched across the red field left to
     right, and then the field tears along it and the two halves travel off.
     Picked from preview-intro.html over a drawn rule, a validation stamp and
     the game number set enormous.

     An empty shell here and everything inside it built by the script below,
     which is deliberate: with JavaScript off there is no overlay at all and
     the page is exactly the page.

     Note the ticket is never hidden. It sits behind the two halves from the
     first frame and the tear uncovers it, so nothing here can leave a visitor
     facing a page whose content is waiting on a class being removed. -->
<div class="boot" id="boot" aria-hidden="true"></div>
<script>
(function () {
  var el = document.getElementById('boot');
  if (!el) return;

  /* Once per tab. He reloads this page all day from admin and the designer,
     and auto-refresh.js reloads it for him every time content.js changes: a
     two-second screen on every one of those is a tax on his own work. Someone
     arriving fresh gets it. ?intro=1 forces it, which is how to look at it
     again without opening a new window. */
  var force = /[?&]intro=1\b/.test(location.search);
  var still = false, seen = false;
  try { still = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  try { seen  = sessionStorage.getItem('bootSeen') === '1'; } catch (e) {}

  /* Asking for less motion is not a preference to be overridden by a query
     string. It wins over ?intro=1 too, which the once-per-tab rule does not:
     the whole point of that flag is to see this again on demand. */
  if (still)          { el.parentNode.removeChild(el); return; }
  if (seen && !force) { el.parentNode.removeChild(el); return; }
  try { sessionStorage.setItem('bootSeen', '1'); } catch (e) {}

  var punch = '<div class="boot-punch"><i></i></div>';
  el.innerHTML =
    '<div class="boot-half top">' + punch + '</div>' +
    '<div class="boot-half bot">' + punch + '</div>';
  document.documentElement.classList.add('is-booting');
  /* THE PANIC EXIT, on the very next line and before anything else can run.
     From here the page is under an overlay, and a throw anywhere below would
     leave it there. This is the line that makes that impossible, so it goes
     first and it never moves. */
  setTimeout(off, 6000);

  el.classList.add('is-punching');

  var torn = false, gone = false;

  function tear() {
    if (torn) return;
    torn = true;
    el.classList.add('is-tearing');
    /* the halves are clear of the screen at .82s; a breath after that the
       overlay has no reason to exist */
    setTimeout(off, 900);
  }

  function off() {
    if (gone) return;
    gone = true;
    document.documentElement.classList.remove('is-booting');
    if (el.parentNode) el.parentNode.removeChild(el);
  }

  /* It tears once the perforation is complete AND the page has actually
     finished loading, whichever is later: a loading screen that lets go while
     the fonts are still arriving is worse than none. The hard cap is the
     safety net, so one slow embed can never hold the ticket behind it. */
  var timeUp = false, ready = document.readyState === 'complete';
  var maybe = function () { if (timeUp && ready) tear(); };
  setTimeout(function () { timeUp = true; maybe(); }, 1460);
  window.addEventListener('load', function () { ready = true; maybe(); });
  setTimeout(function () { ready = timeUp = true; maybe(); }, 3400);

  /* and anyone who does not want to watch tears it themselves. The row of
     holes is completed first, so what they get is the same gesture early
     rather than a different one. */
  ['click', 'touchstart', 'keydown', 'wheel'].forEach(function (ev) {
    window.addEventListener(ev, function () {
      if (torn) return;
      el.classList.add('is-skipped');
      tear();
    }, { once: true, passive: true });
  });
})();
</script>

<main class="ticket">
  <div class="perf top" aria-hidden="true"></div>

  <div class="tk-body">
    <div class="tk-top">
      <span id="tkGame" data-slot="game"></span>
      <span id="tkSerial" data-slot="serial"></span>
    </div>

    <!-- The name is the logo here: the home page has no nav bar, so this is
         the only thing that says whose site this is. Same lockup as the other
         pages, name in capitals with the job under it and not bold. His line
         and the award count sit on the opposite side of the same row, which
         is what the black band used to hold. -->
    <div class="tk-namerow">
      <p class="tk-name" id="tkName" data-slot="name"></p>
      <div class="tk-aside">
        <span id="tkBand" data-slot="band"></span>
        <a class="tk-badge" id="tkBadge" data-slot="badge"></a>
      </div>
    </div>

    <h1 class="tk-title"><span id="tkTitleTop" data-slot="titleTop"></span><span id="tkTitleBottom" data-slot="titleBottom"></span></h1>

    <!-- The sub-line and the tabs share the left column, the stamp holds the
         right and spans both. Before this the stamp sat in a row of its own
         beside a one-line paragraph, so 188px of empty paper opened up under
         the copy while the stamp floated on the other side of it. -->
    <div class="tk-mid">
      <div class="tk-midleft">
      <p class="tk-sub" id="tkSub" data-slot="sub"></p>

        <ul class="won-list" id="wonList" data-slot="won" hidden></ul>
        <nav class="tk-nav" id="tkNav"></nav>
      </div>

      <!-- THE STAMP. A postage stamp, not a rubber one: perforated edge, a
           duotone portrait, the issuing department curved round it, a value
           and the name along the bottom. It is the only image on the page and
           the only thing that is not type, and the whole of it is a link to
           the About page. Every word comes from content.js. -->
      <a class="stamp" id="tkStamp" data-slot="stamp" href="about.html">
        <span class="stamp-perf" aria-hidden="true"></span>
        <span class="stamp-in">
          <svg class="stamp-arc" viewBox="0 0 200 200" aria-hidden="true"
               xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
            <defs>
              <!-- 9 o'clock, clockwise, so the letters sit upright over the top -->
              <path id="stampArcPath" fill="none"
                    d="M100,102 m-91,0 a91,91 0 1,1 182,0 a91,91 0 1,1 -182,0"/>
            </defs>
            <text class="stamp-arc-t">
              <textPath id="stampArc" href="#stampArcPath" xlink:href="#stampArcPath"
                        startOffset="0" textLength="571" lengthAdjust="spacing"></textPath>
            </text>
          </svg>
          <span class="stamp-photo"><img id="stampImg" src="" alt=""></span>
        </span>
        <span class="stamp-band">
          <span class="stamp-value" id="stampValue"></span>
          <span class="stamp-names">
            <span class="stamp-name" id="stampName"></span>
            <span class="stamp-foot" id="stampFoot"></span>
          </span>
        </span>
      </a>
    </div>

    <div class="tk-foot">
      <a class="barcode" id="tkBarcode" data-slot="barcode" aria-label="Playlist"></a>
      <p class="tk-terms" id="tkTerms" data-slot="terms"></p>
    </div>
  </div>

  <div class="perf bot" aria-hidden="true"></div>
</main>

<!-- content.js is fetched with a stamp that changes every minute.
     GitHub Pages serves it with cache-control: max-age=600, so for ten
     minutes after a save the live site kept handing out the previous
     words and the save looked as though it had done nothing. A plain
     request was measured returning a fifty-minute-old copy while the
     same file, asked for with a query, came back current.
     Only on a real web server: a query string on a file URL is not
     reliably understood and the owner previews by double-clicking. -->
<script>
(function () {
  /* only on a real web server. Anything else (file://, and the data: URLs
     some preview panes use) gets exactly the tag this always had, so the
     double-click workflow cannot regress. */
  var v = /^https?:$/.test(location.protocol) ? '?v=' + Math.floor(Date.now() / 60000) : '';
  document.write('<scr' + 'ipt src="content.js' + v + '"><\/scr' + 'ipt>');
})();
</script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT || {};
  var T = C.ticket || {};
  var J = C.jokes || {};

  /* Has he won something yet? The whole home page hangs off this. */
  var won = (T.awards || []).filter(function (a) { return a && String(a).trim(); });
  var hasWon = won.length > 0;
  if (hasWon) document.body.classList.add('has-won');

  function set(id, val) {
    var el = document.getElementById(id);
    if (el) el.textContent = val == null ? '' : val;
  }

  set('tkBand',        hasWon ? (T.wonBand      || T.band)      : T.band);
  set('tkBadge',       hasWon ? (T.wonBadge     || T.badge)     : T.badge);
  set('tkTitleTop',    hasWon ? (T.wonTitleTop  || T.titleTop)  : T.titleTop);
  set('tkTitleBottom', hasWon ? (T.wonTitleBottom || T.titleBottom) : T.titleBottom);
  set('tkGame', T.game);
  set('tkSerial', T.serial);
  /* when he has won something, the retraction line takes over the sub slot */
  set('tkSub', hasWon ? (T.wonLine || T.sub) : T.sub);
  set('tkTerms', T.terms);
  /* the home page has no nav bar, so this band is the only thing on the
     screen that says whose site this is. Always upper case. */
  set('tkName', (T.name || 'MOHAMMED ESSAM').toUpperCase());

  /* ---- the stamp ----
     The arc text repeats until it nearly closes the circle and textLength
     stretches it the rest of the way, so any line he writes fits the ring.
     Blank the arc and the photo and the whole stamp removes itself. */
  (function () {
    var st = document.getElementById('tkStamp');
    if (!st) return;
    var arc = String((hasWon ? (T.wonStampArc || T.stampArc) : T.stampArc) || '').trim();
    var photo = String(T.stampPhoto || '').trim();
    if (!arc && !photo) { st.remove(); return; }

    if (arc) {
      if (!/[·•|,\/-]\s*$/.test(arc)) arc += ' · ';
      else if (!/\s$/.test(arc)) arc += ' ';
      /* exactly three laps, his call. textLength then spaces them to close
         the circle, so the ring stays even however long the line is. */
      set('stampArc', (arc + arc + arc).toUpperCase());
    }
    var img = document.getElementById('stampImg');
    if (photo) {
      img.src = /^https?:\/\//i.test(photo) ? photo : 'images/' + photo.replace(/^images\//, '');
      img.alt = T.stampName || T.name || '';
    } else {
      img.parentNode.remove();
    }
    set('stampValue', T.stampValue);
    set('stampName', (T.stampName || T.name || '').toUpperCase());
    set('stampFoot', T.stampFoot);
    if (T.stampUrl) {
      st.href = T.stampUrl;
      /* anything off this site opens in its own tab, so a visitor reading the
         ticket does not lose it to a playlist */
      if (/^https?:\/\//i.test(T.stampUrl) &&
          T.stampUrl.indexOf(location.origin) !== 0) {
        st.target = '_blank';
        st.rel = 'noopener';
      }
    }
  })();

  /* ---- the award badge ----
     "Won nothing" is a claim, so it opens the cabinet and shows you. Blank
     `badgeUrl` and it goes back to being a label that does nothing. */
  (function () {
    var bd = document.getElementById('tkBadge');
    if (!bd) return;
    var url = String(T.badgeUrl || '').trim();
    if (url) bd.href = url;
  })();

  /* ---- the barcode ----
     It was a decoration. It is a door now: the strip of bars is where the
     playlist lives, which is a better joke than the stamp holding it,
     because a barcode is the one part of a ticket nobody expects to do
     anything. Blank `barcodeUrl` and it goes back to being an ornament. */
  (function () {
    var bc = document.getElementById('tkBarcode');
    if (!bc) return;
    var url = String(T.barcodeUrl || '').trim();
    if (!url) { bc.removeAttribute('aria-label'); bc.setAttribute('aria-hidden', 'true'); return; }
    bc.href = url;
    bc.setAttribute('aria-label', T.barcodeLabel || 'Playlist');
    if (/^https?:\/\//i.test(url) && url.indexOf(location.origin) !== 0) {
      bc.target = '_blank';
      bc.rel = 'noopener';
    }
  })();

  /* ---- THE HOME CANVAS -------------------------------------------------
     If he has laid the ticket out in the designer, `content.layout` holds
     one artboard per shape of screen and every box in it is a PERCENTAGE
     of the ticket, never a pixel: the ticket then scales as one piece and
     the composition holds its proportions at any window size.

     `layout.desktop` is used on a wide landscape screen, `layout.mobile`
     below that. An artboard with no items falls through to the hand-built
     flow layout in the stylesheet, so an untouched phone keeps the layout
     that was tested down to 360px, and deleting `layout` puts everything
     back. With no layout saved, none of this runs.
     ---------------------------------------------------------------------- */
  var COLOR = {
    ink: 'var(--ink)', red: 'var(--red)', deep: 'var(--red-deep)',
    paper: 'var(--paper)', muted: 'var(--ink-60)', faint: 'var(--ink-30)'
  };
  var FONT = {
    home: 'var(--display-home)', display: 'var(--display)', mono: 'var(--mono)',
    body: '"Hanken Grotesk",-apple-system,sans-serif'
  };

  /* WHICH artboard, decided by the DEVICE rather than by the window.
     It used to be `(orientation:landscape) and (min-width:900px)`, so any
     desktop window dragged narrow or tall fell through to the phone
     composition and the ticket stood up vertically on a laptop. That is only
     safe to change because the ticket now scales as one piece: a small
     desktop window shows a smaller desktop ticket instead of breaking.
     A touch screen with no mouse is a phone. Everything else is a desktop,
     at every window size. */
  var TOUCH = window.matchMedia('(hover: none) and (pointer: coarse)');
  function artboard() {
    var L = C.layout || {};
    var phone = TOUCH.matches;
    var a = phone ? L.mobile : L.desktop;
    /* if the one it wants is empty, the other is better than the flow layout */
    if (!(a && a.items && a.items.length)) a = phone ? L.desktop : L.mobile;
    return (a && a.items && a.items.length) ? a : null;
  }

  function imgPath(src) {
    src = String(src || '');
    return /^https?:\/\//i.test(src) ? src : 'images/' + src.replace(/^images\//, '');
  }

  /* an element he added in the designer: a text box, a picture, or a plain
     rectangle of colour. The flow layout has no place for these, so they
     exist only while an artboard is on. */
  function makeFree(it, body) {
    var el = document.createElement(it.url ? 'a' : (it.type === 'text' ? 'p' : 'div'));
    el.className = 'tk-free free-' + (it.type || 'text');
    if (it.url) {
      el.href = it.url;
      if (/^https?:\/\//i.test(it.url) && it.url.indexOf(location.origin) !== 0) {
        el.target = '_blank';
        el.rel = 'noopener';
      }
    }
    if (it.type === 'image') {
      var im = document.createElement('img');
      im.src = imgPath(it.src);
      im.alt = it.alt || '';
      if (it.fit) im.style.objectFit = it.fit;
      el.appendChild(im);
    } else if (it.type !== 'box') {
      el.textContent = it.text || '';
    }
    body.appendChild(el);
    return el;
  }

  /* Which boxes hold their words in the middle. text-align only ever moved
     type across, never down, so a box dragged taller left its line stuck to
     the top edge. Text sits in the middle of its box unless he says
     otherwise. The punches keep their own grid (number in one corner, label
     in the other) and the stamp and barcode are not type at all. */
  var VALIGN = { top: 'flex-start', middle: 'center', bottom: 'flex-end' };
  var NO_VALIGN = { stamp: 1, barcode: 1, won: 1 };
  function valignFor(it) {
    if (it.valign) return VALIGN[it.valign] || null;
    if (it.slot) {
      if (NO_VALIGN[it.slot] || /^nav\d+$/.test(it.slot)) return null;
    } else if (it.type === 'image' || it.type === 'box') {
      return null;
    }
    return VALIGN.middle;
  }

  /* H is the ticket's height in pixels: type is stored as a percentage of it
     so the headline keeps its proportion to the ticket on every screen */
  function styleItem(el, it, H) {
    var s = el.style;
    var va = valignFor(it);
    if (va) { s.display = 'flex'; s.flexDirection = 'column'; s.justifyContent = va; }
    if (it.x != null) s.left = it.x + '%';
    if (it.y != null) s.top = it.y + '%';
    if (it.w != null) s.width = it.w + '%';
    if (it.h != null) s.height = it.h + '%';
    if (it.size) {
      var px = (H * it.size / 100).toFixed(2) + 'px';
      s.fontSize = px;
      el.dataset.baseSize = px;   /* fitTitle shrinks from here, never grows past it */
    }
    if (it.align) s.textAlign = it.align;
    if (it.color) s.color = COLOR[it.color] || it.color;
    if (it.fill) s.background = COLOR[it.fill] || it.fill;
    if (it.font && FONT[it.font]) s.fontFamily = FONT[it.font];
    if (it.weight) s.fontWeight = it.weight;
    if (it.tracking != null) s.letterSpacing = it.tracking + 'em';
    if (it.leading != null) s.lineHeight = it.leading;
    if (it.upper) s.textTransform = 'uppercase';
    if (it.rotate) s.transform = 'rotate(' + it.rotate + 'deg)';
    if (it.opacity != null && it.opacity !== 1) s.opacity = it.opacity;
    if (it.z != null) s.zIndex = it.z;
    if (it.radius) s.borderRadius = it.radius + 'px';
  }

  /* The ticket's natural size while it is locked, and the one number that
     changes as the window is dragged. Kept out here so the resize handler can
     reach it without re-running the whole layout. */
  var NAT = null;
  function scaleTicket() {
    var tk = document.querySelector('.ticket');
    if (!tk || !NAT) return;
    var cs = getComputedStyle(document.body);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var availW = Math.max(120, window.innerWidth - padX);
    var availH = Math.max(120, (window.innerHeight || document.documentElement.clientHeight) - padY);
    var k = Math.min(availW / NAT[0], availH / NAT[1]);
    tk.style.setProperty('--tk-k', k.toFixed(4));
  }
  window.scaleHomeTicket = scaleTicket;

  function applyLayout() {
    var tk = document.querySelector('.ticket');
    var body = document.querySelector('.tk-body');
    if (!tk || !body) return;

    /* wipe the previous pass first, so a resize across the breakpoint lands
       cleanly on the other artboard or back in the flow */
    [].forEach.call(body.querySelectorAll('.tk-free'), function (n) { n.remove(); });
    [].forEach.call(body.querySelectorAll('[data-slot]'), function (n) {
      n.removeAttribute('data-placed');
      n.removeAttribute('style');
      delete n.dataset.baseSize;
    });

    var art = artboard();
    if (!art) {
      tk.classList.remove('is-canvas', 'is-locked');
      document.body.classList.remove('home-locked');
      NAT = null;
      tk.style.removeProperty('--tk-nat-w');
      tk.style.removeProperty('--tk-nat-h');
      tk.style.removeProperty('--tk-k');
      return;
    }
    tk.classList.add('is-canvas');

    /* Lock the ticket to the shape the artboard was drawn at, BEFORE anything
       is measured: H below is read off the laid-out box, so the shape has to
       be settled first or every type size is computed against the wrong
       height. An artboard with no aspect keeps the old stretch behaviour.

       The ticket is laid out ONCE at a fixed natural size and then scaled with
       a transform to fit the window. That is what makes dragging the window
       smooth: sizing it in vw/vh meant every position, every type size and the
       headline fit had to be recomputed, which only happened 120ms after the
       drag stopped, so nothing moved and then everything jumped. A transform
       is one number, it costs no layout, and the composition scales in the
       compositor as the mouse moves. */
    var ratio = parseFloat(art.aspect);
    if (ratio > 0) {
      var natW = parseFloat(art.w) > 0 ? parseFloat(art.w) : (TOUCH.matches ? 390 : 1600);
      var natH = Math.round(natW / ratio);
      tk.style.setProperty('--tk-nat-w', natW + 'px');
      tk.style.setProperty('--tk-nat-h', natH + 'px');
      tk.classList.add('is-locked');
      document.body.classList.add('home-locked');
      NAT = [natW, natH];
      scaleTicket();
    } else {
      tk.classList.remove('is-locked');
      document.body.classList.remove('home-locked');
      NAT = null;
      tk.style.removeProperty('--tk-nat-w');
      tk.style.removeProperty('--tk-nat-h');
      tk.style.removeProperty('--tk-k');
    }

    var H = body.clientHeight;
    var want = 0, got = 0;
    art.items.forEach(function (it) {
      if (!it || it.hidden) return;
      if (it.slot) want++;
      var el = it.slot ? body.querySelector('[data-slot="' + it.slot + '"]') : makeFree(it, body);
      if (!el) return;
      styleItem(el, it, H);
      if (it.slot) { el.setAttribute('data-placed', ''); got++; }
    });

    /* A layout that names boxes this page does not have is a layout from a
       different version of the page. Placing the half of it that still
       matches would leave a ticket with most of its words missing, which is
       far worse than ignoring it: an unplaced box is hidden, and the ones
       that did match would sit alone on an otherwise empty card. So if much
       of it fails to land, drop the whole thing and let the stylesheet lay
       the page out as it always did. Nothing is lost, the file still holds
       his layout, and the designer migrates it when he next opens it. */
    if (want && got < want * 0.75) {
      [].forEach.call(body.querySelectorAll('.tk-free'), function (n) { n.remove(); });
      [].forEach.call(body.querySelectorAll('[data-slot]'), function (n) {
        n.removeAttribute('data-placed');
        n.removeAttribute('style');
        delete n.dataset.baseSize;
      });
      tk.classList.remove('is-canvas', 'is-locked');
      document.body.classList.remove('home-locked');
      NAT = null;
      tk.style.removeProperty('--tk-nat-w');
      tk.style.removeProperty('--tk-nat-h');
      tk.style.removeProperty('--tk-k');
    }
  }
  window.applyHomeLayout = applyLayout;   /* the designer re-runs this as he drags */

  /* ---- keep the headline inside the ticket ----
     The headline is his to rewrite from admin, and one long word ("copywriter"
     already) runs off the edge of a narrow ticket. Rather than tune a font
     size to one particular sentence, measure the longest line and shrink
     until it fits. Runs again once the webfont lands and on resize. */
  function fitTitle() {
    var h = document.querySelector('.tk-title');
    if (!h || !h.children.length) return;
    h.style.fontSize = h.dataset.baseSize || '';
    var box = h.clientWidth;
    if (!box) return;
    var rng = document.createRange();
    /* more than one pass: display faces with an optical-size axis change
       width as the point size changes, so the first sum lands short */
    for (var i = 0; i < 4; i++) {
      var fs = parseFloat(getComputedStyle(h).fontSize);
      var widest = 0;
      [].forEach.call(h.children, function (sp) {
        rng.selectNodeContents(sp);
        widest = Math.max(widest, rng.getBoundingClientRect().width);
      });
      if (!widest || widest <= box) break;
      h.style.fontSize = (fs * box / widest).toFixed(2) + 'px';
    }
  }
  /* The sub-line is held to one line on a wide screen. It is his to rewrite,
     so rather than trust a font size to suit one sentence, measure it against
     the room left beside the stamp and shrink it if it does not fit. Below the
     landscape breakpoint it is allowed to wrap and this does nothing. */
  function fitSub() {
    var p = document.querySelector('.tk-sub');
    if (!p) return;
    p.style.fontSize = '';
    if (getComputedStyle(p).whiteSpace !== 'nowrap') return;
    var room = p.parentNode.clientWidth;
    var stamp = document.getElementById('tkStamp');
    if (stamp) {
      room -= stamp.getBoundingClientRect().width;
      room -= parseFloat(getComputedStyle(p.parentNode).columnGap) || 0;
    }
    var rng = document.createRange();
    for (var i = 0; i < 3; i++) {
      rng.selectNodeContents(p);
      var wide = rng.getBoundingClientRect().width;
      if (!wide || wide <= room) break;
      p.style.fontSize = (parseFloat(getComputedStyle(p).fontSize) * room / wide).toFixed(2) + 'px';
    }
  }

  /* ---- fitting type on the canvas ----
     On an artboard each headline line is its own box, so the flow's fitTitle
     has nothing left to measure: `.tk-title` is display:contents there. What
     is wanted instead is per box, and shrink ONLY. The size he set in the
     designer is the size he gets, unless the words genuinely do not fit the
     box he drew, in which case the type comes down rather than running off
     the edge. Anything shrunk is recorded so the designer can say so, rather
     than quietly making the number he typed a lie. */
  function shrinkToBox(el) {
    var base = el.dataset.baseSize;
    if (base) el.style.fontSize = base;
    var box = el.clientWidth;
    if (!box) return false;
    var rng = document.createRange();
    var shrunk = false;
    /* more than one pass: display faces with an optical-size axis change
       width as the point size changes, so the first sum lands short */
    for (var i = 0; i < 4; i++) {
      rng.selectNodeContents(el);
      var wide = rng.getBoundingClientRect().width;
      if (!wide || wide <= box) break;
      el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * box / wide).toFixed(2) + 'px';
      shrunk = true;
    }
    return shrunk;
  }

  function fitCanvas() {
    var out = [];
    var els = document.querySelectorAll('.ticket.is-canvas [data-placed], .ticket.is-canvas .tk-free');
    [].forEach.call(els, function (el) {
      if (getComputedStyle(el).whiteSpace !== 'nowrap') return;
      if (shrinkToBox(el)) out.push(el.getAttribute('data-slot') || 'added text');
    });
    window.homeShrunk = out;
    return out;
  }

  function onCanvas() {
    var tk = document.querySelector('.ticket');
    return !!tk && tk.classList.contains('is-canvas');
  }
  function fitText() { if (onCanvas()) fitCanvas(); else { fitTitle(); fitSub(); } }
  function fitAll() { applyLayout(); fitText(); }
  /* the designer moves a box and then asks the page to refit the type in it,
     without re-running the whole layout underneath itself */
  window.fitHomeText = fitText;
  window.repaintHomeFoil = function () {
    (window.homeFoils || []).forEach(function (f) { f(); });
  };
  fitAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  /* Two speeds. The scale is one custom property and no layout, so it runs on
     every resize event and the ticket tracks the mouse. Everything else (the
     headline fit, repainting the foil bitmap) is expensive and waits for the
     drag to stop. While the ticket is locked the slow half has nothing to do
     anyway, because the composition is laid out once at its natural size. */
  var fitWait;
  window.addEventListener('resize', function () {
    scaleTicket();
    clearTimeout(fitWait);
    fitWait = setTimeout(fitAll, 140);
  }, { passive: true });

  /* plugging in a mouse, or picking the tablet up, can change the answer to
     "is this a phone", and that swaps the whole composition */
  var onDeviceChange = function () { applyLayout(); fitAll(); };
  if (TOUCH.addEventListener) TOUCH.addEventListener('change', onDeviceChange);
  else if (TOUCH.addListener) TOUCH.addListener(onDeviceChange);

  if (hasWon) {
    var ul = document.getElementById('wonList');
    ul.hidden = false;
    won.forEach(function (a) {
      var li = document.createElement('li');
      li.textContent = a;
      ul.appendChild(li);
    });
  }

  /* nav punches. The scratch one gets a small note sitting directly above
     it, so the line reads as the caption on that box rather than as another
     paragraph competing in the middle of the ticket. */
  var nav = document.getElementById('tkNav');
  (T.nav || []).forEach(function (item, ix) {
    if (item.scratch && T.scratchNote) {
      var cap = document.createElement('span');
      cap.className = 'scratch-cap';
      cap.setAttribute('data-slot', 'scratchNote');
      cap.textContent = T.scratchNote;
      nav.appendChild(cap);
    }
    var a = document.createElement('a');
    /* each punch is addressable on its own, so the designer can move and
       size them separately instead of shifting all three as one block */
    a.setAttribute('data-slot', 'nav' + ix);
    a.href = item.url || '#';
    /* the label goes in its own element: as a bare text node it becomes an
       anonymous grid item and cannot be placed in the box */
    var b = document.createElement('b');
    b.textContent = item.label || '';
    var i = document.createElement('i');
    i.textContent = item.num || '';
    a.appendChild(i);
    a.appendChild(b);
    nav.appendChild(a);
    if (item.scratch) makeScratch(a, item);
  });

  /* ---- the covered box ----------------------------------------
     The last punch is under foil. They scratch it expecting a prize
     and the prize is the ask. This is the one place a scratch panel
     earns its keep: it hides a punchline, not information.

     It can never lock anyone out of contacting him:
       - a plain click (no drag) uncovers it immediately
       - keyboard focus uncovers it
       - once uncovered it stays uncovered on later visits
       - no canvas support, or reduced motion, and it never covers at all
     -------------------------------------------------------------- */
  function makeScratch(link, item) {
    /* The foil comes back on every visit. It used to remember, through
       localStorage, that it had already been scratched: he wants the gag
       fresh every refresh, so nothing is stored any more. The other escape
       hatches all stay, so it can still never lock anyone out. */
    var canScratch = !!document.createElement('canvas').getContext &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!canScratch) { link.classList.add('scratched'); return; }

    link.classList.add('covered');
    var foil = document.createElement('canvas');
    foil.className = 'foil';
    foil.setAttribute('aria-hidden', 'true');
    link.appendChild(foil);

    var ctx = foil.getContext('2d', { willReadFrequently: true });
    var drawing = false, moved = 0, open = false;

    /* Third go. The first was a flat fill, the second a linear gradient that
       came out as brushed aluminium, the third was mid grey with heavy dark
       speckle and read as asphalt. The dark speckle was the mistake: real
       scratch foil is LIGHT silver and its texture is sparkle, which is
       isolated bright specks catching the light, not dirt. So: a light silver
       base, a broad soft sheen, bright grain with only a little dark in it to
       keep it from going flat, and the darkening kept to the very edge. */
    function paint() {
      /* the punch's own unscaled box, NOT its rect. The ticket is laid out at
         a natural size and scaled by a transform, so the rect shrinks and
         grows with the window while the box never moves: drawing to the rect
         re-rasterised the whole sparkle on every resize and made the brush a
         different size at every window width. */
      var w = link.offsetWidth, h = link.offsetHeight;
      if (!w || !h) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      foil.width = Math.round(w * dpr);
      foil.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'source-over';

      /* light silver, very slightly cool */
      ctx.fillStyle = '#bcc0c5';
      ctx.fillRect(0, 0, w, h);

      /* the sheen: a wide soft band across the middle, brighter than the base */
      var sh = ctx.createLinearGradient(0, 0, 0, h);
      sh.addColorStop(0,   'rgba(255,255,255,.16)');
      sh.addColorStop(.32, 'rgba(255,255,255,.58)');
      sh.addColorStop(.55, 'rgba(255,255,255,.22)');
      sh.addColorStop(1,   'rgba(120,124,130,.28)');
      ctx.fillStyle = sh;
      ctx.fillRect(0, 0, w, h);

      /* a second, angled highlight so the panel reads as a surface catching
         light from one side rather than as a flat grey strip. It does not
         move: he asked for brighter, not for something running about. */
      var gl = ctx.createLinearGradient(0, h, w * .78, 0);
      gl.addColorStop(0,   'rgba(255,255,255,0)');
      gl.addColorStop(.42, 'rgba(255,255,255,0)');
      gl.addColorStop(.58, 'rgba(255,255,255,.34)');
      gl.addColorStop(.68, 'rgba(255,255,255,.05)');
      gl.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.fillStyle = gl;
      ctx.fillRect(0, 0, w, h);

      /* brushed direction, very faint, on the diagonal */
      ctx.lineWidth = 1;
      for (var d = -h; d < w; d += 3) {
        ctx.strokeStyle = 'rgba(255,255,255,' + (.02 + Math.random() * .05).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(d, h);
        ctx.lineTo(d + h * .55, 0);
        ctx.stroke();
      }

      /* SPARKLE. Mostly bright, a little dark. This is the tell, and getting
         the ratio wrong is what made the last one look like tarmac. */
      var grains = Math.round(w * h / 7);
      for (var i = 0; i < grains; i++) {
        var bright = Math.random() < .80;
        ctx.fillStyle = bright
          ? 'rgba(255,255,255,' + (.16 + Math.random() * .62).toFixed(3) + ')'
          : 'rgba(96,100,106,'  + (.05 + Math.random() * .18).toFixed(3) + ')';
        ctx.fillRect(Math.random() * w | 0, Math.random() * h | 0,
                     Math.random() < .26 ? 2 : 1, 1);
      }

      /* a scattering of bigger glints. Foil catches the light in points, and
         a field of even grain reads as texture rather than as metal. */
      var glints = Math.round(w * h / 900);
      for (var g = 0; g < glints; g++) {
        var gx = Math.random() * w, gy = Math.random() * h;
        var rad = 1.6 + Math.random() * 2.4;
        var sp = ctx.createRadialGradient(gx, gy, 0, gx, gy, rad);
        sp.addColorStop(0, 'rgba(255,255,255,' + (.55 + Math.random() * .4).toFixed(2) + ')');
        sp.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = sp;
        ctx.fillRect(gx - rad, gy - rad, rad * 2, rad * 2);
      }

      /* only the very edge darkens, so the panel sits on the paper */
      var eg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .42,
                                        w / 2, h / 2, Math.max(w, h) * .62);
      eg.addColorStop(0, 'rgba(0,0,0,0)');
      eg.addColorStop(1, 'rgba(70,73,78,.34)');
      ctx.fillStyle = eg;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(88,92,97,.5)';
      ctx.strokeRect(.5, .5, w - 1, h - 1);

      ctx.fillStyle = 'rgba(46,48,52,.85)';
      ctx.font = '700 11px "Barlow Condensed", sans-serif';
      ctx.textAlign = 'center';
      try { ctx.letterSpacing = '2.4px'; } catch (e) {}
      ctx.fillText((item.scratchHint || 'Scratch to reveal').toUpperCase(),
        w / 2, h / 2 + 4);
    }

    function reveal() {
      if (open) return;
      open = true;
      link.classList.remove('covered');
      link.classList.add('scratched');
      if (foil.parentNode) foil.parentNode.removeChild(foil);
    }

    /* The pointer arrives in screen pixels and the canvas is drawn in the
       ticket's own unscaled pixels, so the parent's scale has to be divided
       back out or the scratch lands away from the cursor on every screen
       that is not exactly 1:1. */
    function at(e) {
      var r = foil.getBoundingClientRect();
      var p = e.touches ? e.touches[0] : e;
      var kx = r.width  ? foil.offsetWidth  / r.width  : 1;
      var ky = r.height ? foil.offsetHeight / r.height : 1;
      return [(p.clientX - r.left) * kx, (p.clientY - r.top) * ky];
    }
    function dig(x, y) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 17, 0, Math.PI * 2);
      ctx.fill();
    }
    function cleared() {
      var d = ctx.getImageData(0, 0, foil.width, foil.height).data, c = 0, t = 0;
      for (var i = 3; i < d.length; i += 4 * 160) { t++; if (d[i] < 26) c++; }
      return t ? c / t : 0;
    }
    /* It opens when they have cleared 60% AND taken their hand off, not the
       instant the threshold is crossed mid-stroke: it used to vanish out from
       under the cursor half way through a scratch, which is not how a scratch
       card behaves. Nothing checks during the drag any more.

       The escape hatches all survive, and they have to: a click with no drag
       opens it, keyboard focus opens it, and a browser without canvas or a
       visitor who asked for less motion never sees the foil at all. Someone
       who cannot drag must never be locked out of the only call to action on
       the page. That also means a plain click still bypasses the 60%, by
       design. */
    var NEEDED = .6;
    function settle() { if (!open && cleared() > NEEDED) reveal(); }

    foil.addEventListener('mousedown', function (e) {
      drawing = true; moved = 0; var c = at(e); dig(c[0], c[1]); e.preventDefault();
    });
    foil.addEventListener('mousemove', function (e) {
      if (!drawing) return; moved++; var c = at(e); dig(c[0], c[1]); e.preventDefault();
    });
    window.addEventListener('mouseup', function () {
      if (!drawing) return;
      drawing = false;
      /* a click with no drag: they tapped it, so just open it */
      if (moved < 3) reveal(); else settle();
    });
    foil.addEventListener('touchstart', function (e) {
      drawing = true; moved = 0; var c = at(e); dig(c[0], c[1]); e.preventDefault();
    }, { passive: false });
    foil.addEventListener('touchmove', function (e) {
      if (!drawing) return; moved++; var c = at(e); dig(c[0], c[1]); e.preventDefault();
    }, { passive: false });
    foil.addEventListener('touchend', function () {
      drawing = false;
      if (moved < 3) reveal(); else settle();
    });

    /* keyboard users never meet the foil */
    link.addEventListener('focus', reveal);
    link.addEventListener('click', function (e) {
      if (!open) { e.preventDefault(); reveal(); }
    });

    window.addEventListener('resize', function () { if (!open) paint(); });
    /* the designer can resize this punch without the window changing size,
       and the foil is a bitmap: without a repaint it would sit there
       stretched. It is only called when a drag finishes, never during one:
       the sparkle is drawn a pixel at a time and is far too slow per frame. */
    (window.homeFoils = window.homeFoils || []).push(function () { if (!open) paint(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint); else paint();
  }

  /* ---- the quiet jokes. each one is optional: blank it in
          content.js and the slot simply goes silent. ---- */
  if (J.tabAway) {
    var realTitle = document.title;
    document.addEventListener('visibilitychange', function () {
      document.title = document.hidden ? J.tabAway : realTitle;
    });
  }
  if (J.console && window.console) console.log('%c' + J.console, 'color:#E3261A;font-size:13px');
})();
</script>

</body>
</html>
