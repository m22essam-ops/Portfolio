<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammed Essam — Award-losing copywriter</title>
<meta name="description" content="Mohammed Essam, copywriter. Cairo, Dubai, Madrid. Work that ran, and work that didn't.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Syne:wght@400..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="is-home">

<main class="ticket">
  <div class="perf top" aria-hidden="true"></div>

  <div class="tk-body">
    <div class="tk-top" data-slot="top">
      <span id="tkGame"></span>
      <span id="tkSerial"></span>
    </div>

    <!-- The name is the logo here: the home page has no nav bar, so this is
         the only thing that says whose site this is. Same lockup as the other
         pages, name in capitals with the job under it and not bold. His line
         and the award count sit on the opposite side of the same row, which
         is what the black band used to hold. -->
    <div class="tk-namerow">
      <p class="tk-name" id="tkName" data-slot="name"></p>
      <div class="tk-aside" data-slot="aside">
        <span id="tkBand"></span>
        <span class="tk-badge" id="tkBadge"></span>
      </div>
    </div>

    <h1 class="tk-title" data-slot="title"><span id="tkTitleTop"></span><span id="tkTitleBottom"></span></h1>

    <!-- The sub-line and the tabs share the left column, the stamp holds the
         right and spans both. Before this the stamp sat in a row of its own
         beside a one-line paragraph, so 188px of empty paper opened up under
         the copy while the stamp floated on the other side of it. -->
    <div class="tk-mid">
      <div class="tk-midleft">
      <p class="tk-sub" id="tkSub" data-slot="sub"></p>

        <ul class="won-list" id="wonList" data-slot="won" hidden></ul>
        <nav class="tk-nav" id="tkNav" data-slot="nav"></nav>
      </div>

      <!-- THE STAMP. A postage stamp, not a rubber one: perforated edge, a
           duotone portrait, the issuing department curved round it, a value
           and the name along the bottom. It is the only image on the page and
           the only thing that is not type, and the whole of it is a link to
           the About page. Every word comes from content.js. -->
      <a class="stamp" id="tkStamp" data-slot="stamp" href="about.html">
        <span class="stamp-perf" aria-hidden="true"></span>
        <span class="stamp-in">
          <svg class="stamp-arc" viewBox="0 0 200 200" aria-hidden="true"
               xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
            <defs>
              <!-- 9 o'clock, clockwise, so the letters sit upright over the top -->
              <path id="stampArcPath" fill="none"
                    d="M100,102 m-91,0 a91,91 0 1,1 182,0 a91,91 0 1,1 -182,0"/>
            </defs>
            <text class="stamp-arc-t">
              <textPath id="stampArc" href="#stampArcPath" xlink:href="#stampArcPath"
                        startOffset="0" textLength="571" lengthAdjust="spacing"></textPath>
            </text>
          </svg>
          <span class="stamp-photo"><img id="stampImg" src="" alt=""></span>
        </span>
        <span class="stamp-band">
          <span class="stamp-value" id="stampValue"></span>
          <span class="stamp-names">
            <span class="stamp-name" id="stampName"></span>
            <span class="stamp-foot" id="stampFoot"></span>
          </span>
        </span>
      </a>
    </div>

    <div class="tk-foot">
      <div class="barcode" data-slot="barcode" aria-hidden="true"></div>
      <p class="tk-terms" id="tkTerms" data-slot="terms"></p>
    </div>
  </div>

  <div class="perf bot" aria-hidden="true"></div>
</main>

<script src="content.js"></script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT || {};
  var T = C.ticket || {};
  var J = C.jokes || {};

  /* Has he won something yet? The whole home page hangs off this. */
  var won = (T.awards || []).filter(function (a) { return a && String(a).trim(); });
  var hasWon = won.length > 0;
  if (hasWon) document.body.classList.add('has-won');

  function set(id, val) {
    var el = document.getElementById(id);
    if (el) el.textContent = val == null ? '' : val;
  }

  set('tkBand',        hasWon ? (T.wonBand      || T.band)      : T.band);
  set('tkBadge',       hasWon ? (T.wonBadge     || T.badge)     : T.badge);
  set('tkTitleTop',    hasWon ? (T.wonTitleTop  || T.titleTop)  : T.titleTop);
  set('tkTitleBottom', hasWon ? (T.wonTitleBottom || T.titleBottom) : T.titleBottom);
  set('tkGame', T.game);
  set('tkSerial', T.serial);
  /* when he has won something, the retraction line takes over the sub slot */
  set('tkSub', hasWon ? (T.wonLine || T.sub) : T.sub);
  set('tkTerms', T.terms);
  /* the home page has no nav bar, so this band is the only thing on the
     screen that says whose site this is. Always upper case. */
  set('tkName', (T.name || 'MOHAMMED ESSAM').toUpperCase());

  /* ---- the stamp ----
     The arc text repeats until it nearly closes the circle and textLength
     stretches it the rest of the way, so any line he writes fits the ring.
     Blank the arc and the photo and the whole stamp removes itself. */
  (function () {
    var st = document.getElementById('tkStamp');
    if (!st) return;
    var arc = String((hasWon ? (T.wonStampArc || T.stampArc) : T.stampArc) || '').trim();
    var photo = String(T.stampPhoto || '').trim();
    if (!arc && !photo) { st.remove(); return; }

    if (arc) {
      if (!/[·•|,\/-]\s*$/.test(arc)) arc += ' · ';
      else if (!/\s$/.test(arc)) arc += ' ';
      /* exactly three laps, his call. textLength then spaces them to close
         the circle, so the ring stays even however long the line is. */
      set('stampArc', (arc + arc + arc).toUpperCase());
    }
    var img = document.getElementById('stampImg');
    if (photo) {
      img.src = /^https?:\/\//i.test(photo) ? photo : 'images/' + photo.replace(/^images\//, '');
      img.alt = T.stampName || T.name || '';
    } else {
      img.parentNode.remove();
    }
    set('stampValue', T.stampValue);
    set('stampName', (T.stampName || T.name || '').toUpperCase());
    set('stampFoot', T.stampFoot);
    if (T.stampUrl) {
      st.href = T.stampUrl;
      /* anything off this site opens in its own tab, so a visitor reading the
         ticket does not lose it to a playlist */
      if (/^https?:\/\//i.test(T.stampUrl) &&
          T.stampUrl.indexOf(location.origin) !== 0) {
        st.target = '_blank';
        st.rel = 'noopener';
      }
    }
  })();

  /* ---- THE HOME CANVAS -------------------------------------------------
     If he has laid the ticket out in the designer, `content.layout` holds
     one artboard per shape of screen and every box in it is a PERCENTAGE
     of the ticket, never a pixel: the ticket then scales as one piece and
     the composition holds its proportions at any window size.

     `layout.desktop` is used on a wide landscape screen, `layout.mobile`
     below that. An artboard with no items falls through to the hand-built
     flow layout in the stylesheet, so an untouched phone keeps the layout
     that was tested down to 360px, and deleting `layout` puts everything
     back. With no layout saved, none of this runs.
     ---------------------------------------------------------------------- */
  var COLOR = {
    ink: 'var(--ink)', red: 'var(--red)', deep: 'var(--red-deep)',
    paper: 'var(--paper)', muted: 'var(--ink-60)', faint: 'var(--ink-30)'
  };
  var FONT = {
    home: 'var(--display-home)', display: 'var(--display)', mono: 'var(--mono)',
    body: '"Hanken Grotesk",-apple-system,sans-serif'
  };

  function artboard() {
    var L = C.layout || {};
    var wide = window.matchMedia('(orientation:landscape) and (min-width:900px)').matches;
    var a = wide ? L.desktop : L.mobile;
    return (a && a.items && a.items.length) ? a : null;
  }

  function imgPath(src) {
    src = String(src || '');
    return /^https?:\/\//i.test(src) ? src : 'images/' + src.replace(/^images\//, '');
  }

  /* an element he added in the designer: a text box, a picture, or a plain
     rectangle of colour. The flow layout has no place for these, so they
     exist only while an artboard is on. */
  function makeFree(it, body) {
    var el = document.createElement(it.url ? 'a' : (it.type === 'text' ? 'p' : 'div'));
    el.className = 'tk-free free-' + (it.type || 'text');
    if (it.url) {
      el.href = it.url;
      if (/^https?:\/\//i.test(it.url) && it.url.indexOf(location.origin) !== 0) {
        el.target = '_blank';
        el.rel = 'noopener';
      }
    }
    if (it.type === 'image') {
      var im = document.createElement('img');
      im.src = imgPath(it.src);
      im.alt = it.alt || '';
      if (it.fit) im.style.objectFit = it.fit;
      el.appendChild(im);
    } else if (it.type !== 'box') {
      el.textContent = it.text || '';
    }
    body.appendChild(el);
    return el;
  }

  /* H is the ticket's height in pixels: type is stored as a percentage of it
     so the headline keeps its proportion to the ticket on every screen */
  function styleItem(el, it, H) {
    var s = el.style;
    if (it.x != null) s.left = it.x + '%';
    if (it.y != null) s.top = it.y + '%';
    if (it.w != null) s.width = it.w + '%';
    if (it.h != null) s.height = it.h + '%';
    if (it.size) {
      var px = (H * it.size / 100).toFixed(2) + 'px';
      s.fontSize = px;
      el.dataset.baseSize = px;   /* fitTitle shrinks from here, never grows past it */
    }
    if (it.align) s.textAlign = it.align;
    if (it.color) s.color = COLOR[it.color] || it.color;
    if (it.fill) s.background = COLOR[it.fill] || it.fill;
    if (it.font && FONT[it.font]) s.fontFamily = FONT[it.font];
    if (it.weight) s.fontWeight = it.weight;
    if (it.tracking != null) s.letterSpacing = it.tracking + 'em';
    if (it.leading != null) s.lineHeight = it.leading;
    if (it.upper) s.textTransform = 'uppercase';
    if (it.rotate) s.transform = 'rotate(' + it.rotate + 'deg)';
    if (it.opacity != null && it.opacity !== 1) s.opacity = it.opacity;
    if (it.z != null) s.zIndex = it.z;
    if (it.radius) s.borderRadius = it.radius + 'px';
  }

  function applyLayout() {
    var tk = document.querySelector('.ticket');
    var body = document.querySelector('.tk-body');
    if (!tk || !body) return;

    /* wipe the previous pass first, so a resize across the breakpoint lands
       cleanly on the other artboard or back in the flow */
    [].forEach.call(body.querySelectorAll('.tk-free'), function (n) { n.remove(); });
    [].forEach.call(body.querySelectorAll('[data-slot]'), function (n) {
      n.removeAttribute('data-placed');
      n.removeAttribute('style');
      delete n.dataset.baseSize;
    });

    var art = artboard();
    if (!art) { tk.classList.remove('is-canvas'); return; }
    tk.classList.add('is-canvas');

    var H = body.clientHeight;
    art.items.forEach(function (it) {
      if (!it || it.hidden) return;
      var el = it.slot ? body.querySelector('[data-slot="' + it.slot + '"]') : makeFree(it, body);
      if (!el) return;
      styleItem(el, it, H);
      if (it.slot) el.setAttribute('data-placed', '');
    });
  }
  window.applyHomeLayout = applyLayout;   /* the designer re-runs this as he drags */

  /* ---- keep the headline inside the ticket ----
     The headline is his to rewrite from admin, and one long word ("copywriter"
     already) runs off the edge of a narrow ticket. Rather than tune a font
     size to one particular sentence, measure the longest line and shrink
     until it fits. Runs again once the webfont lands and on resize. */
  function fitTitle() {
    var h = document.querySelector('.tk-title');
    if (!h || !h.children.length) return;
    h.style.fontSize = h.dataset.baseSize || '';
    var box = h.clientWidth;
    if (!box) return;
    var rng = document.createRange();
    /* more than one pass: display faces with an optical-size axis change
       width as the point size changes, so the first sum lands short */
    for (var i = 0; i < 4; i++) {
      var fs = parseFloat(getComputedStyle(h).fontSize);
      var widest = 0;
      [].forEach.call(h.children, function (sp) {
        rng.selectNodeContents(sp);
        widest = Math.max(widest, rng.getBoundingClientRect().width);
      });
      if (!widest || widest <= box) break;
      h.style.fontSize = (fs * box / widest).toFixed(2) + 'px';
    }
  }
  /* The sub-line is held to one line on a wide screen. It is his to rewrite,
     so rather than trust a font size to suit one sentence, measure it against
     the room left beside the stamp and shrink it if it does not fit. Below the
     landscape breakpoint it is allowed to wrap and this does nothing. */
  function fitSub() {
    var p = document.querySelector('.tk-sub');
    if (!p) return;
    p.style.fontSize = '';
    if (getComputedStyle(p).whiteSpace !== 'nowrap') return;
    var room = p.parentNode.clientWidth;
    var stamp = document.getElementById('tkStamp');
    if (stamp) {
      room -= stamp.getBoundingClientRect().width;
      room -= parseFloat(getComputedStyle(p.parentNode).columnGap) || 0;
    }
    var rng = document.createRange();
    for (var i = 0; i < 3; i++) {
      rng.selectNodeContents(p);
      var wide = rng.getBoundingClientRect().width;
      if (!wide || wide <= room) break;
      p.style.fontSize = (parseFloat(getComputedStyle(p).fontSize) * room / wide).toFixed(2) + 'px';
    }
  }

  function fitAll() { applyLayout(); fitTitle(); fitSub(); }
  /* the designer moves a box and then asks the page to refit the type in it,
     without re-running the whole layout underneath itself */
  window.fitHomeText = function () { fitTitle(); fitSub(); };
  fitAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  var fitWait;
  window.addEventListener('resize', function () {
    clearTimeout(fitWait);
    fitWait = setTimeout(fitAll, 120);
  });

  if (hasWon) {
    var ul = document.getElementById('wonList');
    ul.hidden = false;
    won.forEach(function (a) {
      var li = document.createElement('li');
      li.textContent = a;
      ul.appendChild(li);
    });
  }

  /* nav punches. The scratch one gets a small note sitting directly above
     it, so the line reads as the caption on that box rather than as another
     paragraph competing in the middle of the ticket. */
  var nav = document.getElementById('tkNav');
  (T.nav || []).forEach(function (item) {
    if (item.scratch && T.scratchNote) {
      var cap = document.createElement('span');
      cap.className = 'scratch-cap';
      cap.textContent = T.scratchNote;
      nav.appendChild(cap);
    }
    var a = document.createElement('a');
    a.href = item.url || '#';
    /* the label goes in its own element: as a bare text node it becomes an
       anonymous grid item and cannot be placed in the box */
    var b = document.createElement('b');
    b.textContent = item.label || '';
    var i = document.createElement('i');
    i.textContent = item.num || '';
    a.appendChild(i);
    a.appendChild(b);
    nav.appendChild(a);
    if (item.scratch) makeScratch(a, item);
  });

  /* ---- the covered box ----------------------------------------
     The last punch is under foil. They scratch it expecting a prize
     and the prize is the ask. This is the one place a scratch panel
     earns its keep: it hides a punchline, not information.

     It can never lock anyone out of contacting him:
       - a plain click (no drag) uncovers it immediately
       - keyboard focus uncovers it
       - once uncovered it stays uncovered on later visits
       - no canvas support, or reduced motion, and it never covers at all
     -------------------------------------------------------------- */
  function makeScratch(link, item) {
    /* The foil comes back on every visit. It used to remember, through
       localStorage, that it had already been scratched: he wants the gag
       fresh every refresh, so nothing is stored any more. The other escape
       hatches all stay, so it can still never lock anyone out. */
    var canScratch = !!document.createElement('canvas').getContext &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!canScratch) { link.classList.add('scratched'); return; }

    link.classList.add('covered');
    var foil = document.createElement('canvas');
    foil.className = 'foil';
    foil.setAttribute('aria-hidden', 'true');
    link.appendChild(foil);

    var ctx = foil.getContext('2d', { willReadFrequently: true });
    var drawing = false, moved = 0, checks = 0, open = false;

    /* Third go. The first was a flat fill, the second a linear gradient that
       came out as brushed aluminium, the third was mid grey with heavy dark
       speckle and read as asphalt. The dark speckle was the mistake: real
       scratch foil is LIGHT silver and its texture is sparkle, which is
       isolated bright specks catching the light, not dirt. So: a light silver
       base, a broad soft sheen, bright grain with only a little dark in it to
       keep it from going flat, and the darkening kept to the very edge. */
    function paint() {
      var r = link.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var w = r.width, h = r.height;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      foil.width = Math.round(w * dpr);
      foil.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'source-over';

      /* light silver, very slightly cool */
      ctx.fillStyle = '#b3b7bb';
      ctx.fillRect(0, 0, w, h);

      /* the sheen: a wide soft band across the middle, brighter than the base */
      var sh = ctx.createLinearGradient(0, 0, 0, h);
      sh.addColorStop(0,   'rgba(255,255,255,.10)');
      sh.addColorStop(.34, 'rgba(255,255,255,.40)');
      sh.addColorStop(.55, 'rgba(255,255,255,.16)');
      sh.addColorStop(1,   'rgba(120,124,130,.30)');
      ctx.fillStyle = sh;
      ctx.fillRect(0, 0, w, h);

      /* brushed direction, very faint, on the diagonal */
      ctx.lineWidth = 1;
      for (var d = -h; d < w; d += 3) {
        ctx.strokeStyle = 'rgba(255,255,255,' + (.02 + Math.random() * .05).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(d, h);
        ctx.lineTo(d + h * .55, 0);
        ctx.stroke();
      }

      /* SPARKLE. Mostly bright, a little dark. This is the tell, and getting
         the ratio wrong is what made the last one look like tarmac. */
      var grains = Math.round(w * h / 10);
      for (var i = 0; i < grains; i++) {
        var bright = Math.random() < .72;
        ctx.fillStyle = bright
          ? 'rgba(255,255,255,' + (.10 + Math.random() * .5).toFixed(3) + ')'
          : 'rgba(96,100,106,'  + (.06 + Math.random() * .2).toFixed(3) + ')';
        ctx.fillRect(Math.random() * w | 0, Math.random() * h | 0,
                     Math.random() < .18 ? 2 : 1, 1);
      }

      /* only the very edge darkens, so the panel sits on the paper */
      var eg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .42,
                                        w / 2, h / 2, Math.max(w, h) * .62);
      eg.addColorStop(0, 'rgba(0,0,0,0)');
      eg.addColorStop(1, 'rgba(70,73,78,.34)');
      ctx.fillStyle = eg;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(88,92,97,.5)';
      ctx.strokeRect(.5, .5, w - 1, h - 1);

      ctx.fillStyle = 'rgba(46,48,52,.85)';
      ctx.font = '700 11px "Barlow Condensed", sans-serif';
      ctx.textAlign = 'center';
      try { ctx.letterSpacing = '2.4px'; } catch (e) {}
      ctx.fillText((item.scratchHint || 'Scratch to reveal').toUpperCase(),
        w / 2, h / 2 + 4);
    }

    function reveal() {
      if (open) return;
      open = true;
      link.classList.remove('covered');
      link.classList.add('scratched');
      if (foil.parentNode) foil.parentNode.removeChild(foil);
    }

    function at(e) {
      var r = foil.getBoundingClientRect();
      var p = e.touches ? e.touches[0] : e;
      return [p.clientX - r.left, p.clientY - r.top];
    }
    function dig(x, y) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 17, 0, Math.PI * 2);
      ctx.fill();
    }
    function cleared() {
      var d = ctx.getImageData(0, 0, foil.width, foil.height).data, c = 0, t = 0;
      for (var i = 3; i < d.length; i += 4 * 160) { t++; if (d[i] < 26) c++; }
      return t ? c / t : 0;
    }
    function check() { if (!open && ++checks % 5 === 0 && cleared() > .45) reveal(); }

    foil.addEventListener('mousedown', function (e) {
      drawing = true; moved = 0; var c = at(e); dig(c[0], c[1]); e.preventDefault();
    });
    foil.addEventListener('mousemove', function (e) {
      if (!drawing) return; moved++; var c = at(e); dig(c[0], c[1]); check(); e.preventDefault();
    });
    window.addEventListener('mouseup', function () {
      if (!drawing) return;
      drawing = false;
      /* a click with no drag: they tapped it, so just open it */
      if (moved < 3) reveal(); else check();
    });
    foil.addEventListener('touchstart', function (e) {
      drawing = true; moved = 0; var c = at(e); dig(c[0], c[1]); e.preventDefault();
    }, { passive: false });
    foil.addEventListener('touchmove', function (e) {
      if (!drawing) return; moved++; var c = at(e); dig(c[0], c[1]); check(); e.preventDefault();
    }, { passive: false });
    foil.addEventListener('touchend', function () {
      drawing = false;
      if (moved < 3) reveal(); else check();
    });

    /* keyboard users never meet the foil */
    link.addEventListener('focus', reveal);
    link.addEventListener('click', function (e) {
      if (!open) { e.preventDefault(); reveal(); }
    });

    window.addEventListener('resize', function () { if (!open) paint(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint); else paint();
  }

  /* ---- the quiet jokes. each one is optional: blank it in
          content.js and the slot simply goes silent. ---- */
  if (J.tabAway) {
    var realTitle = document.title;
    document.addEventListener('visibilitychange', function () {
      document.title = document.hidden ? J.tabAway : realTitle;
    });
  }
  if (J.console && window.console) console.log('%c' + J.console, 'color:#E3261A;font-size:13px');
})();
</script>

</body>
</html>
