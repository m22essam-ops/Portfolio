<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohamed Essam — Copywriter</title>
<meta name="description" content="Mohamed Essam, copywriter. Work that got produced, and work that got presented.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400;1,9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav id="siteNav">
  <div class="wrap">
    <div class="brand">
      <a class="logo" href="index.html" aria-label="Mohamed Essam — home"></a>
      <span class="tagline"></span>
    </div>
    <div class="nav-links">
      <a href="index.html#work">WORK</a>
      <a href="about.html">ABOUT</a>
    </div>
    <div class="badge"><span class="badge-dot"></span><span class="badge-text"></span></div>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <p class="hero-sentence" id="heroSentence"></p>
    <p class="hero-loop"><button id="heroLoop" type="button" style="visibility:hidden">↺ back to the start</button></p>
    <p class="hero-dateline" id="heroDateline"></p>
  </div>
</header>

<section id="work">
  <div class="wrap">
    <h2 class="reveal" id="workHeading"></h2>

    <div class="work-toggle reveal" role="tablist">
      <button class="work-toggle-btn active" data-panel="produced" role="tab" aria-selected="true" type="button" id="tabProduced"></button>
      <button class="work-toggle-btn" data-panel="presented" role="tab" aria-selected="false" type="button" id="tabPresented"></button>
    </div>

    <div class="work-panel active" id="panel-produced">
      <div class="work-grid" id="grid-produced"></div>
    </div>

    <div class="work-panel" id="panel-presented">
      <div class="work-grid" id="grid-presented"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p class="footer-line"></p>
  </div>
  <div class="mega-mark" aria-hidden="true"></div>
</footer>

<script src="content.js"></script>
<script src="site.js"></script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT;

  /* ---------- section heading and tab labels ---------- */
  document.getElementById('workHeading').textContent = C.work.heading;
  document.getElementById('tabProduced').textContent = C.work.producedLabel;
  document.getElementById('tabPresented').textContent = C.work.presentedLabel;

  /* ---------- hero: the word chain — one sentence at a time ----------
     Each sentence ends with its clickable word — the LAST word, detected
     automatically (trailing punctuation stripped). Clicking it glitches to
     the next sentence, which begins with that same word. The last sentence
     ends the chain: clicking its word ("work") scrolls to the work section.
     The echoed opening word of each sentence (the previous one's click
     word) is dimmed in italic. */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var sentences = (C.hero.sentences || []).filter(Boolean);
  var heroSentence = document.getElementById('heroSentence');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var currentIndex = 0;
  var isTransitioning = false;
  var GLITCH_CHARS = '!<>-_\\/[]{}=+*^?#$%&';

  function lastWord(text) {
    var t = String(text).trim().replace(/[.,!?;:…]+$/, '');
    var m = t.match(/(\S+)$/);
    return m ? m[1] : t;
  }

  function sentenceHtml(index) {
    var text = sentences[index];
    var kw = lastWord(text);
    var kwAt = text.lastIndexOf(kw);
    var head = text.slice(0, kwAt);
    var tail = text.slice(kwAt + kw.length);
    var open = '';
    var body = head;
    if (index > 0) {
      var prev = lastWord(sentences[index - 1]);
      var first = text.match(/^(\S+)/);
      if (first && first[1].toLowerCase() === prev.toLowerCase()) {
        open = '<span class="echo">' + esc(first[1]) + '</span>';
        body = text.slice(first[1].length, kwAt);
      }
    }
    return open + esc(body) + '<button class="kw" type="button">' + esc(kw) + '</button>' + esc(tail);
  }

  function scrambleTo(index) {
    var target = sentences[index];
    isTransitioning = true;
    heroSentence.classList.add('is-glitching');

    var frameMs = 40;
    var totalFrames = Math.round(1000 / frameMs);
    var frame = 0;

    var timer = setInterval(function () {
      frame++;
      var revealCount = Math.floor((frame / totalFrames) * target.length);
      var out = '';
      for (var i = 0; i < target.length; i++) {
        var ch = target[i];
        out += (i < revealCount || ch === ' ') ? ch : GLITCH_CHARS[Math.floor(Math.random() * GLITCH_CHARS.length)];
      }
      heroSentence.textContent = out;

      if (frame >= totalFrames) {
        clearInterval(timer);
        heroSentence.innerHTML = sentenceHtml(index);
        heroSentence.classList.remove('is-glitching');
        currentIndex = index;
        isTransitioning = false;
        updateLoop();
      }
    }, frameMs);
  }

  /* keep the layout rock-steady: reserve the height of the longest sentence
     once, so a short sentence never lets the page below jump up */
  if (sentences.length) {
    var tallest = 0;
    for (var si = 0; si < sentences.length; si++) {
      heroSentence.innerHTML = sentenceHtml(si);
      tallest = Math.max(tallest, heroSentence.offsetHeight);
    }
    heroSentence.style.minHeight = tallest + 'px';
    heroSentence.innerHTML = sentenceHtml(0);
  }
  updateLoop();

  heroSentence.addEventListener('click', function (e) {
    var btn = e.target.closest('.kw');
    if (!btn || isTransitioning || sentences.length < 2) return;
    /* the last sentence ends the chain: its click word ("work") scrolls to
       the work section instead of advancing */
    if (currentIndex === sentences.length - 1) {
      var workSection = document.getElementById('work');
      if (workSection) workSection.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' });
      return;
    }
    var next = currentIndex + 1;
    if (reduceMotion) {
      currentIndex = next;
      heroSentence.innerHTML = sentenceHtml(next);
      updateLoop();
    } else {
      scrambleTo(next);
    }
  });

  /* ↺ back to the start: the chain's loop. Visible once you've left the
     first sentence; clicking it glitches back to sentence 1. */
  var heroLoop = document.getElementById('heroLoop');
  function updateLoop() {
    /* the ↺ only appears once the chain is finished — on the last sentence */
    if (heroLoop) heroLoop.style.visibility = (sentences.length > 1 && currentIndex === sentences.length - 1) ? 'visible' : 'hidden';
  }
  if (heroLoop) {
    heroLoop.addEventListener('click', function () {
      if (isTransitioning || currentIndex === 0) return;
      if (reduceMotion) {
        currentIndex = 0;
        heroSentence.innerHTML = sentenceHtml(0);
        updateLoop();
      } else {
        scrambleTo(0);
      }
    });
  }

  /* ---------- dateline under the hero ---------- */
  var home = C.home || {};
  document.getElementById('heroDateline').textContent = home.dateline || '';

  /* ---------- work cards ---------- */
  function num(i) { return String(i + 1).padStart(2, '0'); }
  function metaLine(p) { return [p.category, p.year].filter(Boolean).join(' · '); }

  function cardHtml(p, i) {
    var href = p.slug ? 'work.html?slug=' + encodeURIComponent(p.slug) : '#';
    var img = p.image
      ? '<img src="' + esc(window.imgSrc(p.image)) + '" alt="' + esc(p.alt || p.title) + '">'
      : '';
    var d = (i % 2 === 0) ? '0.02s' : '0.08s';
    return '<a class="work-card reveal reveal-stagger" style="--d:' + d + '" href="' + href + '">' +
      '<span class="work-index">' + num(i) + '</span>' +
      img +
      '<div class="work-card-body"><div>' +
      '<span class="work-title">' + esc(p.title) + '</span>' +
      '<span class="work-meta">' + esc(metaLine(p)) + '</span>' +
      '</div><span class="work-arrow">↗</span></div></a>';
  }

  /* draft projects never show; the limits (work.producedLimit /
     presentedLimit, editable in admin) cap how many cards render — 0 = all */
  function shown(list, limit) {
    var v = (list || []).filter(function (p) { return !p.draft; });
    return (limit > 0) ? v.slice(0, limit) : v;
  }
  document.getElementById('grid-produced').innerHTML = shown(C.work.produced, C.work.producedLimit).map(cardHtml).join('');
  document.getElementById('grid-presented').innerHTML = shown(C.work.presented, C.work.presentedLimit).map(cardHtml).join('');

  /* ---------- work toggle ---------- */
  var toggleBtns = document.querySelectorAll('.work-toggle-btn');
  var panels = {
    produced: document.getElementById('panel-produced'),
    presented: document.getElementById('panel-presented')
  };
  function activateTab(k) {
    toggleBtns.forEach(function (b) {
      var on = b.dataset.panel === k;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    Object.keys(panels).forEach(function (p) { panels[p].classList.toggle('active', p === k); });
  }
  toggleBtns.forEach(function (btn) {
    btn.addEventListener('click', function () { activateTab(btn.dataset.panel); });
  });
  /* deep link: the PRESENTED/PRODUCED status on a project page opens the matching tab */
  activateTab(new URLSearchParams(location.search).get('tab') === 'presented' ? 'presented' : 'produced');

  /* cards were injected after site.js ran, so reveal them now */
  window.observeReveals();
})();
</script>

</body>
</html>
