<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The home page on a phone · four options</title>
<!--
  Four phone layouts for the home ticket, side by side in real 390x844 frames
  so they can be compared rather than described.

  Each frame is the REAL index.html with a class set on its <body>, not a
  drawing of it. The layouts themselves live in preview-brutalist.html under
  "PHONE LAYOUTS"; this page only chooses between them, so nothing here can
  drift from what would ship.

  His brief: "homepage the header should be a red tier to bla bla then award
  losing copywriter .. keep the pic in somewhere else with a better ratios and
  that's it".
-->
<style>
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
       background:#1A1A18;color:#EFE9DC}
  header{padding:14px 18px;border-bottom:1px solid #EFE9DC33;position:sticky;top:0;background:#111;z-index:5}
  h1{font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 6px;opacity:.7}
  header p{margin:0;font-size:12px;color:#EFE9DCaa;max-width:88ch}
  .rail{display:flex;gap:22px;padding:22px 18px 40px;overflow-x:auto;align-items:flex-start}
  .col{flex:none;width:390px}
  .cap{margin:0 0 10px}
  .cap b{display:block;font-size:13px;letter-spacing:.06em;margin-bottom:5px}
  .cap span{display:block;font-size:11.5px;color:#EFE9DCaa;line-height:1.55;min-height:5.2em}
  .screen{width:390px;height:844px;border:1px solid #EFE9DC44;background:#000;
          position:relative;overflow:hidden}
  iframe{width:390px;height:844px;border:0;display:block}
  .tagno{position:absolute;top:8px;right:8px;z-index:2;background:#E8FF00;color:#1A1A18;
         font-size:10px;letter-spacing:.1em;padding:3px 7px;font-weight:700}
</style>
</head>
<body>

<header>
  <h1>The home page on a phone &middot; four options</h1>
  <p>Real 390&times;844 frames, each running the actual index.html. Scroll the row sideways; scroll inside a frame to see the whole card. Option A is what ships today.</p>
</header>

<div class="rail" id="rail"></div>

<script>
(function () {
  var OPTS = [
    { k:'', n:'A · Today',
      d:'What ships now. The rail comes first as a row of chips with the photo beside them, then the kicker, name, headline and sub-line. His note: the photo is the first thing you meet and its ratio is set by the row it sits in.' },
    { k:'ph-head', n:'B · His brief',
      d:'Kicker then headline, nothing above them. VALUE, SERIES and the photo all move BELOW the prize rows, and the photo runs the full width of the card at 4:3 instead of being squeezed into a chip row.' },
    { k:'ph-head ph-tall', n:'C · His brief, portrait 3:4',
      d:'Same order as B, but the photo is 3:4 upright rather than 4:3 landscape. Matches the About page portrait, and a face reads better tall than wide.' },
    { k:'ph-head ph-strip', n:'D · His brief, photo as a strip',
      d:'Same order as B, with the photo as a wide 21:9 band under the headline instead of a block lower down. Keeps it near the top without letting it open the page.' }
  ];
  var rail = document.getElementById('rail');
  OPTS.forEach(function (o, i) {
    var col = document.createElement('div'); col.className = 'col';
    var cap = document.createElement('p'); cap.className = 'cap';
    cap.innerHTML = '<b>' + o.n + '</b><span>' + o.d + '</span>';
    var scr = document.createElement('div'); scr.className = 'screen';
    var tag = document.createElement('span'); tag.className = 'tagno';
    tag.textContent = o.k ? o.k.replace(/ph-/g, '') : 'current';
    var f = document.createElement('iframe');
    f.src = 'index.html';
    f.title = o.n;
    f.addEventListener('load', function () {
      try {
        var d = f.contentDocument;
        if (o.k) o.k.split(' ').forEach(function (c) { d.body.classList.add(c); });
      } catch (e) {}
    });
    scr.appendChild(tag); scr.appendChild(f);
    col.appendChild(cap); col.appendChild(scr);
    rail.appendChild(col);
  });
})();
</script>
</body>
</html>
