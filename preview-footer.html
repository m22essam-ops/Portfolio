<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footer options · Mohammed Essam</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Syne:wght@400..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">

<!-- NOT LINKED FROM THE SITE. Same job as preview-intro.html: three versions
     of one thing, side by side, built out of the REAL footer so nothing here
     flatters itself. site.js builds the live footer into a hidden host below
     and each option is assembled from those actual nodes, so the type, the
     icons, the colours and the reveal animation are the ones that ship. -->
<style>
  body{padding:0 0 120px}
  .pv-head{padding:54px 0 10px}
  .pv-head h1{font-size:clamp(30px,5vw,54px);margin:0 0 10px}
  .pv-head p{max-width:62ch;font-size:17px;line-height:1.6;color:var(--fg-dim);margin:0 0 6px}
  .pv-opt{margin:0 0 26px;border-top:2px solid var(--fg);padding-top:14px}
  .pv-tag{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--fg);margin:0 0 4px;font-weight:700;
  }
  .pv-why{font-size:15px;line-height:1.55;color:var(--fg-dim);max-width:74ch;margin:0 0 4px}
  .pv-verdict{font-size:15px;line-height:1.55;color:var(--red);max-width:74ch;margin:0}
  /* each option gets the page's own ground so the footer sits on what it
     will really sit on, and the reveal is forced on: these are not scrolled
     into view one at a time the way the real one is */
  .pv-stage{background:var(--bg);margin-top:6px}
  .pv-stage .foot{margin-top:0}
  #pvHost{position:absolute;left:-9999px;top:0;width:1200px}

  /* ---- option B: the dead space carries the contact details ----
     Nothing here overrides the footer's own type or colour. It only adds a
     right-hand column and lets the existing flex row do the work. */
  .pv-b .foot-col{
    display:flex;flex-direction:column;align-items:flex-end;gap:11px;
    flex:none;padding-bottom:6px;
  }
  .pv-b .foot-col a.pv-mail{
    font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.09em;
    text-transform:none;color:var(--fg);text-decoration:none;
    border-bottom:1px solid var(--line);padding-bottom:2px;
  }
  .pv-b .foot-col a.pv-mail:hover{color:var(--red);border-bottom-color:var(--red)}
  .pv-b .foot-col a.pv-cv{
    font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--fg-dim);text-decoration:none;
  }
  .pv-b .foot-col a.pv-cv:hover{color:var(--red)}
  .pv-b .foot-social{padding-bottom:0}

  /* ---- option C: the address is its own beat under the line ---- */
  .pv-c .foot-in{flex-direction:column;align-items:stretch;gap:0}
  .pv-c .pv-row{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:34px;margin-top:26px;
  }
  .pv-c a.pv-mail{
    font-family:var(--mono);font-size:clamp(20px,2.4vw,30px);font-weight:600;
    letter-spacing:.06em;color:var(--fg);text-decoration:none;
    border-bottom:2px solid var(--line);padding-bottom:3px;
  }
  .pv-c a.pv-mail:hover{color:var(--red);border-bottom-color:var(--red)}
  .pv-c .pv-side{
    display:flex;align-items:center;gap:22px;flex:none;padding-bottom:4px;
  }
  .pv-c a.pv-cv{
    font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--fg-dim);text-decoration:none;
  }
  .pv-c a.pv-cv:hover{color:var(--red)}
  .pv-c .foot-social{padding-bottom:0}

  @media (max-width:760px){
    .pv-b .foot-in,.pv-c .pv-row{flex-direction:column;align-items:flex-start;gap:20px}
    .pv-b .foot-col{align-items:flex-start}
  }
</style>
</head>
<body class="page page-about">

<header class="pv-head">
  <div class="wrap">
    <h1>Three footers.</h1>
    <p>Built out of the real one, so the type, the icons and the colours are
       the ones that ship. Not linked from the site. Pick one, or tell me what
       is wrong with all three.</p>
  </div>
</header>

<!-- site.js fills this. Everything below is assembled from its nodes. -->
<footer class="foot" id="siteFoot" hidden></footer>
<div id="pvHost"></div>

<div class="wrap" id="pvOptions"></div>

<script src="content.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var built = document.getElementById('siteFoot');
  var host  = document.getElementById('pvOptions');
  if (!built || !host) return;

  var line   = built.querySelector('.foot-in > p');
  var social = built.querySelector('.foot-social');
  if (!line) { host.textContent = 'The footer did not build.'; return; }

  var C = window.SITE_CONTENT || {};
  var links = (C.contact && C.contact.links) || [];
  var mail = '';
  links.forEach(function (l) {
    if (!mail && l && /^mailto:/i.test(String(l.url || ''))) mail = l.label || l.url.replace(/^mailto:/i, '');
  });
  mail = mail || 'm22essam@gmail.com';
  var mailUrl = 'mailto:' + mail;
  var cv = (C.contact && C.contact.resume) || {};

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var OPTS = [
    {
      key: 'a',
      tag: 'Option A — what is there now',
      why: 'Your line on the left, four 23px icons on the right. They are bottom-aligned ' +
           'to the last line, so nothing is broken. It is thin because 370px between the ' +
           'end of the sentence and the first icon is carrying nothing.',
      verdict: 'The real cost: your email address is not written anywhere on the site. ' +
               'The only way to reach you from a project page is a nav link saying "Say hi" ' +
               'and four small marks.',
      build: function (stage) {
        var row = document.createElement('div');
        row.className = 'wrap foot-in';
        row.appendChild(line.cloneNode(true));
        if (social) row.appendChild(social.cloneNode(true));
        stage.appendChild(row);
      }
    },
    {
      key: 'b',
      tag: 'Option B — the gap carries the contact details',
      why: 'Same row, same alignment, same line. The empty right-hand side becomes the ' +
           'address, the CV and the icons, right-aligned and stacked. Set in Barlow ' +
           'Condensed because on this site that is the system voice: serials, labels, ' +
           'small print. An address is system information, not a headline.',
      verdict: 'My pick. It fixes the hole without touching a word you wrote, and it puts ' +
               'the two things a CD is actually looking for where the eye already ends up.',
      build: function (stage) {
        var row = document.createElement('div');
        row.className = 'wrap foot-in';
        row.appendChild(line.cloneNode(true));
        var col = document.createElement('div');
        col.className = 'foot-col';
        col.innerHTML =
          '<a class="pv-mail" href="' + esc(mailUrl) + '">' + esc(mail) + '</a>' +
          (cv.url ? '<a class="pv-cv" href="' + esc(cv.url) + '" target="_blank" rel="noopener">' +
                    esc(cv.label || 'Résumé') + ' &darr;</a>' : '');
        if (social) col.appendChild(social.cloneNode(true));
        row.appendChild(col);
        stage.appendChild(row);
      }
    },
    {
      key: 'c',
      tag: 'Option C — the address is its own beat',
      why: 'The line keeps the whole width, and the address drops underneath it at ' +
           'display size with the CV and the icons on the far side. Two beats instead ' +
           'of one: the joke, then the way to act on it.',
      verdict: 'Louder, and taller by about 90px. Right if you want the footer to be the ' +
               'contact page this site does not have. Wrong if the joke should stay the ' +
               'last thing anyone reads.',
      build: function (stage) {
        var inner = document.createElement('div');
        inner.className = 'wrap foot-in';
        inner.appendChild(line.cloneNode(true));
        var row = document.createElement('div');
        row.className = 'pv-row';
        row.innerHTML = '<a class="pv-mail" href="' + esc(mailUrl) + '">' + esc(mail) + '</a>';
        var side = document.createElement('div');
        side.className = 'pv-side';
        if (cv.url) {
          side.innerHTML = '<a class="pv-cv" href="' + esc(cv.url) + '" target="_blank" rel="noopener">' +
                           esc(cv.label || 'Résumé') + ' &darr;</a>';
        }
        if (social) side.appendChild(social.cloneNode(true));
        row.appendChild(side);
        inner.appendChild(row);
        stage.appendChild(inner);
      }
    }
  ];

  OPTS.forEach(function (o) {
    var block = document.createElement('section');
    block.className = 'pv-opt';
    block.innerHTML =
      '<p class="pv-tag">' + esc(o.tag) + '</p>' +
      '<p class="pv-why">' + esc(o.why) + '</p>' +
      '<p class="pv-verdict">' + esc(o.verdict) + '</p>';
    var stage = document.createElement('div');
    stage.className = 'pv-stage pv-' + o.key;
    var f = document.createElement('footer');
    /* is-near forces the reveal on: these are all on screen together and are
       not scrolled into view one at a time the way the real footer is */
    f.className = 'foot is-near';
    stage.appendChild(f);
    o.build(f);
    block.appendChild(stage);
    host.appendChild(block);
  });

  /* the hidden original has done its job */
  built.remove();
})();
</script>
</body>
</html>
