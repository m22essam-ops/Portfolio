     Drawn here as inline SVG rather than dropped in as a picture, for the
     same reasons the seal on the home page and the cabinet are: there is
     nothing to download, it stays sharp at any size, and it takes its ink
     from the page's own tokens so it can never fight the palette.

     It sits in the markup and is MOVED by the script into the middle of the
     article, after the second paragraph, which is the beat it belongs on
     ("You read." and then the man with his head in his hand). Doing it that
     way rather than building the SVG in JavaScript means it is still drawn
     with the script off, where it simply stays below the words instead of
     moving up into them. Deliberately NOT a <template>: template content is
     inert, so with JavaScript off there would be no drawing at all.

     joke: the notepad and the pen are on the seat and nobody is holding

<!-- content.js is fetched with a stamp that changes every minute, and only
     over http(s) so the double-click preview keeps working. -->
<script>
(function () {
  var v = /^https?:$/.test(location.protocol) ? '?v=' + Math.floor(Date.now() / 60000) : '';
  document.write('<scr' + 'ipt src="content.js' + v + '"><\/scr' + 'ipt>');
})();
</script>
<script src="site.js"></script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT || {};
  var M = C.manipulating || {};

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function set(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var t = String(val == null ? '' : val).trim();
    if (t) el.textContent = t; else el.remove();
  }

  document.title = (M.heading ? String(M.heading).replace(/\.$/, '') : 'Manipulating') +
                   ' · Mohammed Essam';
  set('mLabel', M.label);
  set('mHeading', M.heading);

  /* The last paragraph and the link belong together on the page, so the link
     is added to the end of the article rather than sitting in its own block
     under it: "Anyway. Now that you are here." and the way out are one beat,
     and a rule of white space between them kills it. */
  /* Three blocks, in this order: the opening, then the manifesto set apart,
     then the close. They are separate arrays in content.js rather than one
     list with markers in it, because a marker is a thing he has to remember
     and a field is a thing he can see. Any of the three can be emptied and
     its block simply does not print. */
  function block(list) {
    return (list || []).filter(function (p) { return String(p || '').trim(); });
  }
  var html = block(M.paragraphs).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');

  var creed = block(M.manifesto);
  if (creed.length) {
    html += '<div class="manip-creed">' +
      creed.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
      '</div>';
  }

  html += block(M.close).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');

  var url = String(M.linkUrl || '').trim();
  var text = String(M.linkText || '').trim();
  if (url && text) {
    html += '<p class="manip-out"><a href="' + esc(url) + '">' + esc(text) +
            ' <span aria-hidden="true">&rarr;</span></a></p>';
  }
  var body = document.getElementById('mBody');
  body.innerHTML = html;

  /* The drawing moves up into the article, after the second paragraph. That
     is the beat it belongs on: "You read." and then the man with his head in
     his hand. It is moved rather than built, so with the script off it is
     still on the page, just below the words instead of inside them.

     Blank the caption in admin and the caption line removes itself; the
     drawing stays, because it is not a caption's illustration. */
  var fig = document.getElementById('mDrawing');
  if (fig) {
    var cap = document.getElementById('mCaption');
    var capText = String(M.caption || '').trim();
    if (cap) {
      if (capText) cap.textContent = '“' + capText + '”';
      else cap.remove();
    }
    /* the drawing goes after the second line of the OPENING, which is the
       beat it belongs on: "You read." and then the man with his head in his
       hand. Scoped to direct children so the manifesto's own paragraphs can
       never be counted. */
    var ps = body.querySelectorAll(':scope > p');
    if (ps.length >= 2) ps[1].insertAdjacentElement('afterend', fig);
    else body.appendChild(fig);
  }

  var J = C.jokes || {};
  if (J.tabAway) {
    var realTitle = document.title;
    document.addEventListener('visibilitychange', function () {
      document.title = document.hidden ? J.tabAway : realTitle;
    });
  }
  if (J.console && window.console) console.log('%c' + J.console, 'color:#E3261A;font-size:13px');
})();
</script>
