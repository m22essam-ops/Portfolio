     the design, not an unfinished one: it is the shortest thing on the site
     and it is meant to be, because the joke is that you came a long way for
     six lines. Every word is in content.js under `manipulating`, so it is

<footer class="stub" id="siteFoot"></footer>

<!-- content.js is fetched with a stamp that changes every minute, and only
     over http(s) so the double-click preview keeps working. -->
<script>
(function () {
  var v = /^https?:$/.test(location.protocol) ? '?v=' + Math.floor(Date.now() / 60000) : '';
  document.write('<scr' + 'ipt src="content.js' + v + '"><\/scr' + 'ipt>');
})();
</script>
<script src="site.js"></script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT || {};
  var M = C.manipulating || {};

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function set(id, val) {
    var el = document.getElementById(id);
    if (!el) return;
    var t = String(val == null ? '' : val).trim();
    if (t) el.textContent = t; else el.remove();
  }

  document.title = (M.heading ? String(M.heading).replace(/\.$/, '') : 'Manipulating') +
                   ' · Mohammed Essam';
  set('mLabel', M.label);
  set('mHeading', M.heading);

  /* The last paragraph and the link belong together on the page, so the link
     is added to the end of the article rather than sitting in its own block
     under it: "Anyway. Now that you are here." and the way out are one beat,
     and a rule of white space between them kills it. */
  var paras = (M.paragraphs || []).filter(function (p) { return String(p || '').trim(); });
  var html = paras.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');

  var url = String(M.linkUrl || '').trim();
  var text = String(M.linkText || '').trim();
  if (url && text) {
    html += '<p class="manip-out"><a href="' + esc(url) + '">' + esc(text) +
            ' <span aria-hidden="true">&rarr;</span></a></p>';
  }
  document.getElementById('mBody').innerHTML = html;

  var J = C.jokes || {};
  if (J.tabAway) {
    var realTitle = document.title;
    document.addEventListener('visibilitychange', function () {
      document.title = document.hidden ? J.tabAway : realTitle;
    });
  }
  if (J.console && window.console) console.log('%c' + J.console, 'color:#E3261A;font-size:13px');
})();
</script>
