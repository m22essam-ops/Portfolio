<div id="page"></div>

<!-- the tear-off stub. site.js fills it, so there is one copy of it
     for the work index, the about page and every project page. -->
<footer class="stub" id="siteFoot"></footer>

<!-- content.js is fetched with a stamp that changes every minute.
     GitHub Pages serves it with cache-control: max-age=600, so for ten
     minutes after a save the live site kept handing out the previous
     words and the save looked as though it had done nothing. A plain
     request was measured returning a fifty-minute-old copy while the
     same file, asked for with a query, came back current.
     Only on a real web server: a query string on a file URL is not
     reliably understood and the owner previews by double-clicking. -->
<script>
(function () {
  /* only on a real web server. Anything else (file://, and the data: URLs
     some preview panes use) gets exactly the tag this always had, so the
     double-click workflow cannot regress. */
  var v = /^https?:$/.test(location.protocol) ? '?v=' + Math.floor(Date.now() / 60000) : '';
  document.write('<scr' + 'ipt src="content.js' + v + '"><\/scr' + 'ipt>');
})();
</script>
<script src="site.js"></script>
<script src="auto-refresh.js"></script>
<script>
(function () {
  var C = window.SITE_CONTENT || {};
  var W = C.work || {};
  var J = C.jokes || {};
  var page = document.getElementById('page');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function live(list) {
    return (list || []).filter(function (p) {
      return !p.draft && p.title && String(p.title).trim();
    });
  }

  /* ONE list, in the order it sits in content.js. Whether a piece ran is
     a flag on the project (ran), not a separate array, so everything can
     be reordered against everything else. Old two-array files still load. */
  function allWork() {
    if (Array.isArray(W.projects)) {
      var out = live(W.projects).map(function (p) { return { p: p, ran: p.ran !== false }; });
      var lim = parseInt(W.limit, 10);
      return (lim > 0) ? out.slice(0, lim) : out;
    }
    return live(W.produced).map(function (p) { return { p: p, ran: true }; })
      .concat(live(W.presented).map(function (p) { return { p: p, ran: false }; }));
  }

  var qs   = new URLSearchParams(location.search);
  var slug = qs.get('slug');
  /* ?ran=1 shows only the work that was actually made. It is the second
     punch on the ticket, "Work that worked". Which side a project falls on
     is the "It got produced" tickbox inside it in admin, so he moves a piece
     across by ticking a box, not by moving it between lists.
     Note this is the produced/spec split coming back as a door rather than
     as tabs over one grid. It was killed as tabs in Aug 2026 for good
     reasons; he asked for it back in this form on 21 Aug and that stands.
     The plain work page is still everything, best first, one grid. */
  var ranOnly = qs.get('ran') === '1';

  /* ============ WORK INDEX ============ */
  function renderIndex() {
    var items = allWork();
    if (ranOnly) items = items.filter(function (e) { return e.ran; });

    var heading = ranOnly ? (W.ranHeading || 'Work that worked.') : (W.heading || 'The work.');
    var note    = ranOnly ? (W.ranNote || '') : (W.note || '');
    document.getElementById('pageTitle').textContent =
      (ranOnly ? 'Work that worked' : 'The work') + ' · Mohammed Essam';

    page.innerHTML =
      '<header class="page-head"><div class="wrap">' +
        '<h1>' + esc(heading) + '</h1>' +
        (note ? '<p class="note">' + esc(note) + '</p>' : '') +
        (ranOnly
          ? '<p class="note"><a class="all-work" href="work.html">See everything, including the work that never ran →</a></p>'
          : '') +
      '</div></header>' +
      '<div class="wrap"><div class="work-list" id="workList"></div></div>';

    /* The two work pages get their own ground and their own rhythm, so they
       are told apart at a glance instead of by reading the heading. Only the
       everything page is staggered; work that worked keeps the uniform grid
       he asked to leave alone. */
    if (!ranOnly) document.body.classList.add('page-work-all');

    var list = document.getElementById('workList');

    if (!items.length) {
      list.innerHTML = '<p class="note">' + esc(J.emptyWork || 'Nothing here yet.') + '</p>';
      return;
    }

    list.innerHTML = items.map(function (entry, i) {
      var p = entry.p;
      var sticker = p.sticker && String(p.sticker).trim()
        ? '<span class="sticker' + (entry.ran ? '' : ' spec') + '">' + esc(p.sticker) + '</span>'
        : '';
      var img = p.image
        ? '<div class="frame">' + sticker + '<img src="' + esc(window.imgSrc(p.image)) +
          '" alt="' + esc(p.alt || p.title) + '" loading="lazy"></div>'
        : '<div class="frame empty">' + sticker + '</div>';
      var meta = [p.client, p.year].filter(Boolean).join(' · ');

      return '<a class="piece reveal" href="work.html?slug=' + encodeURIComponent(p.slug) + '">' +
        img +
        '<span class="serial">NO. ' + String(i + 1).padStart(2, '0') +
          (meta ? ' · ' + esc(meta.toUpperCase()) : '') + '</span>' +
        '<h2>' + esc(p.title) + '</h2>' +
        (p.tagline ? '<p>' + esc(p.tagline) + '</p>' : '') +
        '</a>';
    }).join('');

    if (window.observeReveals) window.observeReveals();
  }

  /* ============ PROJECT DETAIL ============ */
  function renderProject(entry) {
    var p = entry.p;
    document.getElementById('pageTitle').textContent = p.title + ' · Mohammed Essam';

    var status = entry.ran ? (W.producedLabel || 'Produced') : (W.presentedLabel || 'Spec');
    var html = '<section class="project"><div class="wrap">' +
      '<a class="back-link" href="work.html">← All work</a>' +
      '<p class="project-meta">' + esc([p.client, p.category, p.year].filter(Boolean).join(' · ')) +
      ' · <span class="' + (entry.ran ? 'status-produced' : 'status-pitched') + '">' + esc(status) + '</span>' +
      (p.sticker ? ' · ' + esc(p.sticker) : '') + '</p>' +
      '<h1 class="project-title">' + esc(p.title) + '</h1>';

    var story = (p.story || []).filter(function (t) { return t && String(t).trim(); });
    if (story.length) {
      html += '<div class="project-body">' +
        story.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + '</div>';
    }

    var media = (p.media || []).filter(function (m) { return m.src && String(m.src).trim(); });
    if (media.length) {
      html += '<div class="media-grid">' + media.map(function (m) {
        var cap = m.caption ? '<figcaption>' + esc(m.caption) + '</figcaption>' : '';
        if (m.type === 'video') {
          var src = String(m.src).trim();
          /* a local file in images/ */
          if (!/^https?:\/\//i.test(src) && !/<iframe/i.test(src)) {
            return '<figure class="project-media"><div class="video-wrap"><video src="' +
              esc(window.imgSrc(src)) + '" controls preload="metadata" playsinline></video></div>' + cap + '</figure>';
          }
          /* a pasted embed: dig the src out of it */
          var em = /<iframe[^>]*\bsrc=["']([^"']+)["']/i.exec(src);
          if (em) src = em[1];
          return '<figure class="project-media"><div class="video-wrap"><iframe src="' + esc(src) +
            '" title="' + esc(m.caption || p.title) + '" frameborder="0" loading="lazy"' +
            ' allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>' + cap + '</figure>';
        }
        return '<figure class="project-media" data-layout="' + esc(m.layout || '') + '"><img src="' +
          esc(window.imgSrc(m.src)) + '" alt="' + esc(m.caption || p.alt || p.title) +
          '" loading="lazy">' + cap + '</figure>';
      }).join('') + '</div>';
    }

    var credits = (p.credits || []).filter(function (c) {
      return (c.role && String(c.role).trim()) || (c.name && String(c.name).trim());
    });
    if (credits.length) {
      html += '<div class="credits"><h2 class="credits-head">Credits</h2><ul class="credits-list">' +
        credits.map(function (c) {
          return '<li><span>' + esc(c.role) + '</span>' + esc(c.name) + '</li>';
        }).join('') + '</ul></div>';
    }

    /* ONE next-project link. Never a grid of ten. */
    var all = allWork();
    var idx = -1;
    for (var k = 0; k < all.length; k++) if (all[k].p.slug === p.slug) { idx = k; break; }
    var next = (idx > -1 && idx < all.length - 1) ? all[idx + 1] : null;
    var label = J.nextLabel || 'Next';
    if (next) {
      html += '<a class="next-project" href="work.html?slug=' + encodeURIComponent(next.p.slug) + '">' +
        '<span class="next-label">' + esc(label) + '</span>' +
        '<span class="next-title">' + esc(next.p.title) + '</span>' +
        '<span class="next-arrow">→</span></a>';
    } else {
      html += '<a class="next-project" href="work.html">' +
        '<span class="next-label">Back to</span><span class="next-title">All work</span>' +
        '<span class="next-arrow">→</span></a>';
    }

    html += '</div></section>';
    page.innerHTML = html;
  }

  if (slug) {
    var found = allWork().filter(function (e) { return e.p.slug === slug; })[0];
    if (found) {
      renderProject(found);
    } else {
      /* "go home" in the broken-link line should actually go home, so the
         last word of it gets wired to the home page. If the line doesn't
         say "home", a link is added after it instead. */
      var line = esc(J.notFound || 'That one is not here.');
      var linked = /home/i.test(line)
        ? line.replace(/home(?![\s\S]*home)/i, '<a href="index.html">home</a>')
        : line + ' <a href="index.html">Home</a>';

      page.innerHTML = '<section class="project"><div class="wrap">' +
        '<a class="back-link" href="work.html">← All work</a>' +
        '<h1 class="project-title">Not found</h1>' +
        '<div class="project-body"><p>' + linked + '</p></div>' +
        '</div></section>';
    }
  } else {
    renderIndex();
  }

  /* the footer stub, including its small print, is built by site.js */

  if (J.tabAway) {
    var realTitle = document.title;
    document.addEventListener('visibilitychange', function () {
      document.title = document.hidden ? J.tabAway : realTitle;
    });
  }
  if (J.console && window.console) console.log('%c' + J.console, 'color:#E3261A;font-size:13px');
})();
</script>

</body>
